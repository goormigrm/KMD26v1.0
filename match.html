<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMD26 · 경기</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#0b0f14;--line:#30363d;--txt:#e6edf3;--sub:#a9b4c0;
      --acc:#2ea8ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--gold:#e3b341}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 'Segoe UI','Malgun Gothic',sans-serif;
     padding:16px 12px 60px;max-width:900px;margin:0 auto}
a{color:var(--acc);text-decoration:none}
h1{font-size:18px;color:var(--gold)}
h3{font-size:14px;color:var(--gold);margin-bottom:8px}
.sub{color:var(--sub);font-size:12.5px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 대진 한 줄 — 구단과 "어느 라인업으로" 를 나란히 고른다 */
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.mrow .lb{width:34px;flex:none;color:var(--sub);font-size:12.5px;font-weight:800}
.mrow select{min-width:0}
select,button{background:var(--bg3);color:var(--txt);border:1px solid var(--line);
       border-radius:8px;padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}

/* ── 전광판 ───────────────────────────────── */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
       background:linear-gradient(180deg,#14301c,#0f2415);border:1px solid #24402a;
       border-radius:11px;padding:16px 14px}
.side{display:flex;align-items:center;gap:9px;min-width:0}
.side.a{justify-content:flex-end}
.side .bar{width:6px;height:30px;border-radius:3px;flex:none;box-shadow:0 0 0 1px #0006}
.side .nm{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px;white-space:nowrap}
.clock{text-align:center;font-size:12.5px;color:#cfe6d6;font-variant-numeric:tabular-nums}
.bar2{height:5px;background:#0b0f1466;border-radius:3px;overflow:hidden;margin-top:10px;grid-column:1/-1}
.bar2>i{display:block;height:100%;background:var(--ok);width:0}

/* ── 해설 ─────────────────────────────────── */
.log{height:340px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--bg3);padding:6px 4px}
.ev{display:flex;gap:9px;padding:4px 8px;font-size:13px;line-height:1.55;border-radius:6px}
.ev .m{color:var(--sub);font-size:11.5px;min-width:32px;text-align:right;padding-top:2px;
       font-variant-numeric:tabular-nums;flex:none}
.ev .x{flex:1}
.ev.goal{background:#12331c;font-weight:700}
.ev.big{background:#2a1f0e}
.ev.bad{color:#ffb4ad}
.ev.warn{color:#e8c46a}
.ev.info{color:var(--sub)}
.ev .tm{font-weight:800;font-size:11.5px;padding:0 5px;border-radius:4px;background:#161b22;flex:none}

/* ── 2D 하이라이트 ─────────────────────────── */
.hl{position:relative;margin-bottom:12px}
.hl canvas{width:100%;display:block;border-radius:10px;background:#0f2415;border:1px solid #24402a}
.hl .cap{position:absolute;left:0;right:0;bottom:0;padding:7px 11px;font-size:13px;font-weight:700;
     background:linear-gradient(0deg,#000c,#0000);border-radius:0 0 10px 10px}
.hl .badge{position:absolute;top:8px;left:10px;background:#000a;border:1px solid #ffffff33;
     border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:800}
.hl .skip{position:absolute;top:8px;right:10px}
.hl .skip button{padding:3px 9px;font-size:11.5px;border-radius:6px}
.hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;margin-top:8px}
.hlist button{padding:6px 8px;font-size:12px;text-align:left;font-weight:700}
.hlist .k{display:block;font-size:11px;color:var(--sub);font-weight:600}

/* ── 경기 뒤 반응 ──────────────────────────── */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){ .rgrid{grid-template-columns:1fr} }
.rh{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:5px}
.rmsg{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--line);
      border-radius:7px;padding:6px 9px;font-size:12.5px;margin-bottom:5px;line-height:1.5}
.rmsg.up{border-left-color:var(--ok)}
.rmsg.dn{border-left-color:var(--bad)}
.rmsg .nick{color:var(--acc);font-size:11.5px;margin-right:4px}
.rside{padding:5px 12px;font-size:12.5px}

/* ── 통계 ─────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:5px 8px;border-bottom:1px solid #21262d}
td.k{text-align:center;color:var(--sub);font-size:12px;width:40%}
td.h{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
td.a{text-align:left;font-weight:700;font-variant-numeric:tabular-nums}
.note{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--acc);
      border-radius:6px;padding:9px 11px;font-size:12.5px;color:var(--sub);margin-top:9px}
code{background:var(--bg3);padding:1px 6px;border-radius:4px;color:var(--gold);font-size:12px}
</style>
</head>
<body>

<div class="top">
  <div><h1>경기</h1><div class="sub" id="meta">불러오는 중…</div></div>
  <div class="sub"><a href="index.html">← 첫 페이지</a> · <a href="lineup.html">라인업</a></div>
</div>

<div class="card" id="setup">
  <h3>대진</h3>
  <div class="mrow"><span class="lb">홈</span>
    <select id="homeSel"></select><select id="homePlan"></select></div>
  <div class="mrow"><span class="lb">원정</span>
    <select id="awaySel"></select><select id="awayPlan"></select></div>
  <div class="row" style="margin-top:9px"><button id="start" class="pri">▶ 경기 시작</button></div>
  <div class="note" id="setupNote"></div>
</div>

<div id="game" style="display:none">
  <div class="board">
    <div class="side"><span class="bar" id="hCol"></span><span class="nm" id="hName"></span></div>
    <div>
      <div class="score" id="score">0 : 0</div>
      <div class="clock" id="clock">킥오프 대기</div>
    </div>
    <div class="side a"><span class="nm" id="aName"></span><span class="bar" id="aCol"></span></div>
    <div class="bar2"><i id="prog"></i></div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="hl" id="hl" style="display:none">
      <canvas id="cv" width="700" height="440"></canvas>
      <div class="badge" id="hlBadge"></div>
      <div class="skip"><button id="hlSkip">건너뛰기 ✕</button></div>
      <div class="cap" id="hlCap"></div>
    </div>
    <div class="row" style="justify-content:space-between;margin-bottom:9px">
      <div class="row">
        <button id="play" class="pri">⏸ 일시정지</button>
        <button class="spd" data-s="1">1배속</button>
        <button class="spd on" data-s="2">2배속</button>
        <button class="spd" data-s="4">4배속</button>
        <button id="skip">⏭ 끝까지</button>
      </div>
      <div class="row"><button id="again">다시 대진 고르기</button></div>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="card" id="result" style="display:none"></div>
</div>

<script type="module">
import { autoLineup, planSig, sideLabels } from "./src/engine/teams.js";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let DB = null, T = null, R = null;      // R = 경기 결과
let minute = 0, idx = 0, timer = null, speed = 2, playing = false;

/* 1분을 몇 밀리초에 흘려보낼지. 1배속이면 90분 경기가 1분쯤 걸린다.
   경기를 먼저 다 돌려 놓고 재생만 하므로, 배속은 엔진 속도와 아무 상관이 없다. */
const MS_PER_MIN = 640;

async function boot() {
  try {
    const m = await fetch("data/meta.json", { cache: "no-cache" }).then(r => r.json());
    const v = "?v=" + (m.dataHash || "");
    const [t, p, rx] = await Promise.all([
      fetch("data/teams.json" + v).then(r => r.json()),
      fetch("data/players.json" + v).then(r => r.json()),
      fetch("data/reactions.json" + v).then(r => r.json()).catch(() => null),
    ]);
    DB = { teams: t.teams, order: t.order, players: p, meta: m, react: rx };
    T = t.tables;
  } catch (e) {
    $("#meta").innerHTML = `<span style="color:var(--bad)">데이터를 불러오지 못했습니다 — ${esc(e.message)}</span>`;
    return;
  }
  $("#meta").textContent = `${DB.meta.teamCount}개 구단 · ${DB.meta.playerCount}명`;

  const opts = ["k1", "k2"].map(lg =>
    `<optgroup label="${lg === "k1" ? "K리그1" : "K리그2"}">` +
    DB.order[lg].map(id => `<option value="${id}">${esc(DB.teams[id].short)}</option>`).join("") +
    `</optgroup>`).join("");
  $("#homeSel").innerHTML = opts;
  $("#awaySel").innerHTML = opts;

  // 라인업 화면에서 넘어왔으면 그 팀·전술을 그대로 쓴다
  HAND = loadPlan();
  SLOTS = loadSlots();
  const hid0 = HAND ? HAND.id : DB.order.k1[0];
  $("#homeSel").value = hid0;
  // 처음 열었을 때는 다른 구단끼리 — 같은 구단은 골라야 나오게 한다
  $("#awaySel").value = DB.order.k1.find(id => id !== hid0) || DB.order.k1[0];
  drawPlanSel("home"); drawPlanSel("away");
  if (HAND) $("#homePlan").value = "hand";
  describe();

  for (const s of ["home", "away"]) {
    $(`#${s}Sel`).onchange = () => { drawPlanSel(s); describe(); };
    $(`#${s}Plan`).onchange = describe;
  }
  $("#start").onclick = start;
  $("#again").onclick = () => {
    stop(); $("#game").style.display = "none"; $("#setup").style.display = "";
    // 다른 탭에서 라인업을 새로 저장했을 수 있다 — 목록을 다시 읽는다
    HAND = loadPlan(); SLOTS = loadSlots();
    drawPlanSel("home"); drawPlanSel("away"); describe();
  };
  $("#play").onclick = () => (playing ? pause() : resume());
  $("#skip").onclick = skipToEnd;
  document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
    speed = +b.dataset.s;
    document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b));
    if (playing) { pause(); resume(); }
  });
}

/* ── 라인업 고르기 ────────────────────────────────────────────
   한쪽만 짤 수 있으면 "같은 구단끼리 다른 전술"을 시험할 수 없다.
   양쪽 모두 자동 · 라인업 화면 · 저장 슬롯 열 벌 중에서 고른다.
   단계 5 의 대전 코드가 생기면 상대 쪽 칸을 코드가 대신한다. */
let HAND = null, SLOTS = [];

/** 라인업 화면이 남겨 둔 것 */
function loadPlan() {
  try {
    const s = localStorage.getItem("kmd26.lineup");
    if (!s) return null;
    const p = JSON.parse(s);
    return (p && p.id && DB.teams[p.id] && p.xi) ? p : null;
  } catch (e) { return null; }
}

/** 라인업 화면의 저장 슬롯 열 벌 */
function loadSlots() {
  try {
    const a = JSON.parse(localStorage.getItem("kmd26.slots") || "[]");
    return Array.isArray(a) ? a.filter(s => s && DB.teams[s.id] && s.xi) : [];
  } catch (e) { return []; }
}

/** 그 구단으로 쓸 수 있는 라인업 목록 */
function planSources(teamId) {
  const out = [{ v: "auto", t: "자동 라인업" }];
  if (HAND && HAND.id === teamId) out.push({ v: "hand", t: "라인업 화면에서 짠 것" });
  SLOTS.forEach((s, i) => {
    if (s.id === teamId) out.push({ v: "slot:" + i, t: `저장 ${i + 1}번 · ${s.formation || ""}`.trim() });
  });
  return out;
}

function drawPlanSel(side) {
  const sel = $(`#${side}Plan`), keep = sel.value;
  const list = planSources($(`#${side}Sel`).value);
  sel.innerHTML = list.map(o => `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join("");
  if (list.some(o => o.v === keep)) sel.value = keep;
}

/* 옛 저장본에는 포메이션이 안 담겨 있다 — 자리 이름 묶음으로 되찾는다.
   되찾지 못하면 커널이 4-3-3 모양을 기준으로 남은 자리를 채운다(배치 자체는 지켜진다). */
function formationOf(xiMap) {
  const have = Object.keys(xiMap || {}).filter(s => s !== "GK").sort().join(",");
  for (const f of Object.keys(T.formation))
    if (T.formation[f].map(s => s[1]).sort().join(",") === have) return f;
  return "4-3-3";
}

/** 화면이 쓰는 라인업 모양 → 일꾼에게 넘길 모양 */
function planFor(teamId, src) {
  const saved = src === "hand" ? HAND
    : (String(src).startsWith("slot:") ? SLOTS[+String(src).slice(5)] : null);
  if (saved && saved.id === teamId) {
    const xiMap = saved.xi;
    return { id: teamId, xiMap, xi: Object.values(xiMap), bench: saved.bench || [],
             // 포메이션은 시드에도 들어가야 하므로 전술 안에 넣어 둔다
             tac: Object.assign({}, saved.tac,
                  { formation: saved.formation || (saved.tac || {}).formation || formationOf(xiMap) }),
             roles: saved.roles || {} };
  }
  const { xi, bench } = autoLineup(DB.players[teamId], T, "4-3-3");
  return { id: teamId, xiMap: xi, xi: Object.values(xi), bench,
           tac: { formation: "4-3-3" }, roles: {} };
}

/** 지금 고른 대진이 어떤 경기가 될지 한 줄로 알려 준다 */
function describe() {
  const hid = $("#homeSel").value, aid = $("#awaySel").value;
  const hp = planFor(hid, $("#homePlan").value), ap = planFor(aid, $("#awayPlan").value);
  const same = hid === aid;
  const note = [];
  if (same) {
    note.push(planSig(hp) === planSig(ap)
      ? `<span style="color:var(--bad)">양 팀의 선수·전술이 완전히 같습니다 —
         라인업이나 전술을 한 가지라도 바꿔 주세요.</span>`
      : `같은 구단끼리의 대전입니다 — 이름표에 <b>(홈)</b>·<b>(어웨이)</b> 를 붙이고
         원정 쪽은 원정 유니폼 색으로 그립니다.`);
  }
  if (!HAND && !SLOTS.length)
    note.push(`양쪽 모두 <b>자동 라인업</b>입니다.
      <a href="lineup.html">라인업 화면</a>에서 짜 두면 여기서 골라 쓸 수 있습니다.`);
  else
    note.push(`라인업은 칸마다 따로 고릅니다 — 자동 · 라인업 화면에서 짠 것 ·
      저장 슬롯. 그 구단으로 저장한 것만 목록에 나옵니다.`);
  $("#setupNote").innerHTML = note.join("<br>");
}

function start() {
  const hid = $("#homeSel").value, aid = $("#awaySel").value;
  const hp = planFor(hid, $("#homePlan").value), ap = planFor(aid, $("#awayPlan").value);

  /* 같은 구단끼리는 붙을 수 있다 — 선수와 전술이 다르면 다른 팀이다.
     다만 라인업 지문까지 똑같으면 두 팀을 가릴 것이 없다(일꾼도 같은 이유로 막는다). */
  if (planSig(hp) === planSig(ap)) { describe(); return; }

  stopClip(); $("#hl").style.display = "none";
  $("#setup").style.display = "none";
  $("#game").style.display = "";
  $("#result").style.display = "none";
  $("#log").innerHTML = `<div class="ev info"><span class="m"></span><span class="x">경기를 준비하고 있습니다… (8초쯤 걸립니다)</span></div>`;
  $("#score").textContent = "0 : 0";
  $("#clock").textContent = "계산 중";
  $("#prog").style.width = "0%";
  // 전광판은 결과가 오기 전에도 켜진다 — 같은 구단이면 여기서도 이름표를 갈라 둔다
  const L = hid === aid ? sideLabels(DB.teams[hid]) : null;
  paintTeams(L ? L.h : DB.teams[hid], L ? L.a : DB.teams[aid]);

  const w = new Worker("src/engine/matchworker.js", { type: "module" });
  w.onmessage = e => {
    w.terminate();
    if (!e.data.ok) {
      $("#log").innerHTML = `<div class="ev bad"><span class="m"></span><span class="x">경기를 치르지 못했습니다 — ${esc(e.data.error)}</span></div>`;
      return;
    }
    R = e.data;
    paintTeams(R.home, R.away);
    minute = 0; idx = 0;
    $("#log").innerHTML = "";
    resume();
  };
  w.onerror = ev => {
    w.terminate();
    $("#log").innerHTML = `<div class="ev bad"><span class="m"></span><span class="x">일꾼 오류 — ${esc(ev.message || "알 수 없음")}</span></div>`;
  };
  w.postMessage({
    teams: DB.teams, players: DB.players, reactions: DB.react,
    home: hp, away: ap,
  });
}

function paintTeams(h, a) {
  $("#hCol").style.background = h.col; $("#hName").textContent = h.short;
  $("#aCol").style.background = a.col; $("#aName").textContent = a.short;
}

/* ── 재생 ─────────────────────────────────────────────────────
   경기는 이미 다 끝나 있다. 여기서는 이벤트를 분 단위로 풀어놓기만 한다. */
function resume() {
  if (!R || playing) return;
  playing = true;
  $("#play").textContent = "⏸ 일시정지";
  timer = setInterval(tick, MS_PER_MIN / speed);
}
function pause() {
  playing = false;
  $("#play").textContent = "▶ 재생";
  clearInterval(timer); timer = null;
}
function stop() { pause(); R = null; }

function tick() {
  if (!R) return pause();
  minute++;
  // "90+3" 같은 추가시간 표기는 90 이후로 몰아서 푼다
  const minOf = e => (typeof e.min === "number" ? e.min : 90 + (parseInt(String(e.min).split("+")[1], 10) || 0));
  let shown = false, big = null;
  while (idx < R.events.length && minOf(R.events[idx]) <= minute) {
    const e = R.events[idx++];
    push(e); shown = true;
    // 골이 나오면 그 장면을 2D 로 보여 준다 — 사람들이 보고 싶은 건 이것이다
    if (!big && e.type === "goal") big = e;
  }
  $("#clock").textContent = minute >= 90 ? `90+${minute - 90}분` : `${minute}분`;
  $("#prog").style.width = Math.min(100, minute / 90 * 100) + "%";
  if (shown) $("#log").scrollTop = $("#log").scrollHeight;

  if (big) {
    const c = clipAt(minute, "goal") || clipAt(minute);
    if (c) {
      c._seen = true;
      pause();                       // 장면을 보는 동안 시계는 멈춘다
      playClip(c, big.txt, () => { $("#hl").style.display = "none"; resume(); });
      return;
    }
  }
  if (idx >= R.events.length && minute >= 90) finish();
}

function push(e) {
  const row = document.createElement("div");
  row.className = "ev " + (e.type || "txt");
  row.innerHTML = `<span class="m">${e.noTime ? "" : esc(String(e.min ?? "")) + "'"}</span>
    ${e.t ? `<span class="tm" style="color:${esc(e.col || "#a9b4c0")}">${esc(e.t)}</span>` : ""}
    <span class="x">${esc(e.txt || "")}</span>`;
  $("#log").appendChild(row);
  // 전광판은 그 줄이 공개되는 순간의 점수를 따른다 — 골보다 먼저 올라가지 않게
  if (e.hg != null) $("#score").textContent = `${e.hg} : ${e.ag}`;
}

function skipToEnd() {
  if (!R) return;
  while (idx < R.events.length) push(R.events[idx++]);
  minute = 90;
  $("#log").scrollTop = $("#log").scrollHeight;
  finish();
}

function finish() {
  pause();
  $("#clock").textContent = "경기 종료";
  $("#prog").style.width = "100%";
  $("#score").textContent = `${R.home.goals} : ${R.away.goals}`;

  const s = R.stats, h = s.h, a = s.a;
  const line = (k, hv, av) => `<tr><td class="h">${hv}</td><td class="k">${k}</td><td class="a">${av}</td></tr>`;
  $("#result").style.display = "";
  $("#result").innerHTML = `
    <h3>경기 기록</h3>
    <table>
      ${line("점유율", R.possession.h + "%", R.possession.a + "%")}
      ${line("슈팅", h.shot, a.shot)}
      ${line("유효 슈팅", h.shotOn, a.shotOn)}
      ${line("패스", h.pass, a.pass)}
      ${line("패스 성공률", pct(h.passOk, h.pass), pct(a.passOk, a.pass))}
      ${line("태클", h.tackle, a.tackle)}
      ${line("파울", h.foul, a.foul)}
      ${line("경고 · 퇴장", `${h.yellow} · ${h.red}`, `${a.yellow} · ${a.red}`)}
      ${line("코너", h.corner, a.corner)}
      ${line("오프사이드", h.offside, a.offside)}
      ${line("크로스", h.cross, a.cross)}
    </table>
    ${R.goalLine.length ? `<div class="note"><b>득점</b> — ${
      R.goalLine.map(g => `${g.min}' ${esc(g.n || "")}
        <span class="sub">(${esc(g.side === "h" ? R.home.short : R.away.short)})</span>`).join(" · ")}</div>` : ""}
    <div class="note">
      주심 ${esc(R.referee || "-")} · 계산 ${R.elapsedMs}ms
      <br>시드 <code>${R.seed.toString(16)}</code> · 결과 지문 <code>${esc(R.fp)}</code>
      <br><span class="sub">같은 라인업끼리 붙으면 언제 어디서 돌려도 이 지문이 나옵니다.
      단계 5에서 이 값이 대전 코드에 담깁니다.</span>
    </div>
    ${drawHighlightList()}
    ${drawReactions()}`;

  $("#result").querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    const c = R.clips[+b.dataset.c];
    playClip(c, `${c.min}' ${KIND_N[c.kind] || c.kind}`, () => {});
    $("#hl").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  bindReactions();
}

const pct = (ok, n) => (n ? Math.round(ok / n * 100) + "%" : "-");

/* ── 2D 하이라이트 ────────────────────────────────────────────
   90분 전체를 그리지 않는 이유: 해설 재생이 90분을 1분에 흘려보내므로
   1분에 150장을 그려야 합니다. 사람이 볼 수 있는 속도가 아닙니다.
   엔진이 markHighlight() 로 짚어 둔 결정적 장면만 앞뒤로 잘라 보여 줍니다. */
const KIND_N = { goal: "골", miss: "결정적 기회", save: "선방", pen: "페널티킥", red: "퇴장" };
let clipTimer = null, onClipEnd = null;

function drawFrame(f) {
  const cv = $("#cv"), g = cv.getContext("2d");
  const W = cv.width, H = cv.height, PAD = 14;
  const X = x => PAD + x * (W - PAD * 2);
  const Y = y => PAD + y * (H - PAD * 2);

  g.fillStyle = "#12301b"; g.fillRect(0, 0, W, H);
  // 잔디 줄무늬 — 공이 어디쯤인지 눈으로 가늠하게 해 준다
  g.fillStyle = "#14351e";
  for (let i = 0; i < 8; i += 2) g.fillRect(X(i / 8), 0, (W - PAD * 2) / 8, H);
  g.strokeStyle = "#ffffff33"; g.lineWidth = 1.5;
  g.strokeRect(X(0), Y(0), X(1) - X(0), Y(1) - Y(0));
  g.beginPath(); g.moveTo(X(.5), Y(0)); g.lineTo(X(.5), Y(1)); g.stroke();
  g.beginPath(); g.arc(X(.5), Y(.5), (Y(1) - Y(0)) * 0.13, 0, 7); g.stroke();
  for (const s of [0, 1]) {   // 페널티 박스
    const bx = s ? X(1) - (X(1) - X(0)) * 0.17 : X(0);
    g.strokeRect(bx, Y(.21), (X(1) - X(0)) * 0.17, Y(.79) - Y(.21));
  }

  if (!f) return;
  // 선수 — 홈은 왼쪽에서 오른쪽으로 공격한다
  for (let i = 0; i + 2 < f.a.length; i += 3) {
    const id = f.a[i], x = f.a[i + 1], y = f.a[i + 2];
    const p = R.roster[id] || {};
    const home = p.side === "h";
    g.beginPath(); g.arc(X(x), Y(y), p.gk ? 7.5 : 8.5, 0, 7);
    g.fillStyle = p.gk ? "#e3b341" : (home ? R.home.col : R.away.col);
    g.fill();
    g.lineWidth = 1.5; g.strokeStyle = "#0009"; g.stroke();
    if (id === f.o) {                    // 공을 가진 선수 — 흰 링
      g.beginPath(); g.arc(X(x), Y(y), 12, 0, 7);
      g.strokeStyle = "#fff"; g.lineWidth = 2; g.stroke();
    }
    if (p.no !== "" && p.no != null) {
      g.fillStyle = "#fff"; g.font = "bold 9px sans-serif"; g.textAlign = "center";
      g.fillText(String(p.no), X(x), Y(y) + 3);
    }
  }
  // 심판
  g.beginPath(); g.arc(X(f.r[0]), Y(f.r[1]), 5, 0, 7);
  g.fillStyle = "#1c1c1c"; g.fill(); g.strokeStyle = "#ffffff55"; g.lineWidth = 1; g.stroke();
  // 공 — 높이가 있으면 그림자와 함께 띄운다
  const bz = f.b[2] || 0, lift = Math.min(14, bz * 90);
  if (lift > 1) {
    g.beginPath(); g.ellipse(X(f.b[0]), Y(f.b[1]), 4, 2, 0, 0, 7);
    g.fillStyle = "#0006"; g.fill();
  }
  g.beginPath(); g.arc(X(f.b[0]), Y(f.b[1]) - lift, 4.5, 0, 7);
  g.fillStyle = "#fff"; g.fill();
  g.strokeStyle = "#0008"; g.lineWidth = 1; g.stroke();
}

/** 클립 한 편을 재생한다. 끝나면 done() */
function playClip(c, caption, done) {
  stopClip();
  $("#hl").style.display = "";
  $("#hlBadge").textContent = `${c.min}' ${KIND_N[c.kind] || c.kind}`;
  $("#hlCap").textContent = caption || "";
  onClipEnd = done;
  let i = 0;
  // 엔진 한 장 = 0.2초, 경기 시계로는 0.4초. 40ms 로 뿌리면 실제보다 조금 빠르게 흐른다.
  clipTimer = setInterval(() => {
    if (i >= c.frames.length) { stopClip(); if (done) done(); return; }
    drawFrame(c.frames[i++]);
  }, 40);
}
function stopClip() {
  if (clipTimer) clearInterval(clipTimer);
  clipTimer = null;
}
$("#hlSkip").onclick = () => { const f = onClipEnd; stopClip(); $("#hl").style.display = "none"; onClipEnd = null; if (f) f(); };

/** 해설이 그 분에 닿았을 때 볼만한 장면이 있으면 잡아 온다 */
function clipAt(min, kind) {
  if (!R || !R.clips) return null;
  return R.clips.find(c => !c._seen && Math.abs(c.min - min) <= 1 && (!kind || c.kind === kind)) || null;
}

function drawHighlightList() {
  if (!R.clips || !R.clips.length) return "";
  return `<h3 style="margin-top:14px">다시 보기</h3>
    <div class="hlist">${R.clips.map((c, i) =>
      `<button data-c="${i}">${c.min}' <span class="k">${KIND_N[c.kind] || c.kind}</span></button>`).join("")}</div>`;
}

/* ── 경기 뒤 반응 ─────────────────────────────────────────────
   문구 표는 KM26 에서 그대로 가져왔습니다. 어느 쪽 팬 시선으로 볼지 고를 수 있습니다. */
let reactSide = "h";

function drawReactions() {
  if (!R.react || !R.react.h) return "";
  return `<h3 style="margin-top:16px">경기 뒤 반응</h3>
    <div class="row" style="margin-bottom:8px">
      <button class="rside on" data-s="h">${esc(R.home.short)} 팬</button>
      <button class="rside" data-s="a">${esc(R.away.short)} 팬</button>
    </div>
    <div id="reactBox">${reactHTML()}</div>`;
}

function reactHTML() {
  const r = R.react[reactSide];
  if (!r) return "";
  const tone = t => t > 0 ? "up" : t < 0 ? "dn" : "";
  return `
    <div class="rgrid">
      <div>
        <div class="rh">📱 소셜미디어</div>
        ${r.social.map(x => `<div class="rmsg ${tone(x.tone)}">${esc(x.txt)}</div>`).join("")
          || `<div class="sub" style="padding:8px">조용합니다.</div>`}
      </div>
      <div>
        <div class="rh">💬 FM코리아</div>
        ${r.fmk.map(x => `<div class="rmsg ${tone(x.tone)}">
            <b class="nick">${esc(x.nick)}</b> ${esc(x.txt)}</div>`).join("")
          || `<div class="sub" style="padding:8px">글이 없습니다.</div>`}
      </div>
    </div>`;
}

function bindReactions() {
  document.querySelectorAll(".rside").forEach(b => b.onclick = () => {
    reactSide = b.dataset.s;
    document.querySelectorAll(".rside").forEach(x => x.classList.toggle("on", x === b));
    $("#reactBox").innerHTML = reactHTML();
  });
}

boot();
</script>
</body>
</html>
