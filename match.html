<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMD26 · 경기</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#0b0f14;--line:#30363d;--txt:#e6edf3;--sub:#a9b4c0;
      --acc:#2ea8ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--gold:#e3b341}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 'Segoe UI','Malgun Gothic',sans-serif;
     }
a{color:var(--acc);text-decoration:none}
h1{font-size:18px;color:var(--gold)}
h3{font-size:14px;color:var(--gold);margin-bottom:8px}
.sub{color:var(--sub);font-size:12.5px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 대진 한 줄 — 구단과 "어느 라인업으로" 를 나란히 고른다 */
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.mrow .lb{width:34px;flex:none;color:var(--sub);font-size:12.5px;font-weight:800}
.mrow select{min-width:0}
/* 대전 코드 상자 — 51자가 한눈에 들어오게 고정폭 글꼴 */
.cin{flex:1;min-width:210px;background:var(--bg3);color:var(--gold);border:1px solid var(--line);
     border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:monospace}
.cin.bad{border-color:var(--bad);color:var(--bad)}
select,button{background:var(--bg3);color:var(--txt);border:1px solid var(--line);
       border-radius:8px;padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}

/* ── 전광판 ───────────────────────────────── */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
       background:linear-gradient(180deg,#14301c,#0f2415);border:1px solid #24402a;
       border-radius:11px;padding:16px 14px}
.side{display:flex;align-items:center;gap:9px;min-width:0}
.side.a{justify-content:flex-end}
.side .bar{width:6px;height:30px;border-radius:3px;flex:none;box-shadow:0 0 0 1px #0006}
.side .nm{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px;white-space:nowrap}
.clock{text-align:center;font-size:12.5px;color:#cfe6d6;font-variant-numeric:tabular-nums}
.bar2{height:5px;background:#0b0f1466;border-radius:3px;overflow:hidden;margin-top:10px;grid-column:1/-1}
.bar2>i{display:block;height:100%;background:var(--ok);width:0}

/* ── 해설 ─────────────────────────────────────────────────────
   아래에서 채워 위로 올라옵니다 — 가장 새 줄이 맨 위(필드 화면 바로 아래)에 옵니다.
   짧을 때는 바닥에 붙어 있게 안쪽 상자에 margin-top:auto 를 줍니다
   (justify-content:flex-end 로 하면 넘칠 때 위쪽이 잘려 스크롤이 안 됩니다). */
.log{height:340px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--bg3);
     padding:6px 4px;display:flex;flex-direction:column}
.log>.in{margin-top:auto}
.ev{display:flex;gap:9px;padding:4px 8px;font-size:13px;line-height:1.55;border-radius:6px}
.ev .m{color:var(--sub);font-size:11.5px;min-width:32px;text-align:right;padding-top:2px;
       font-variant-numeric:tabular-nums;flex:none}
.ev .x{flex:1}
.ev.goal{background:#12331c;font-weight:700}
.ev.big{background:#2a1f0e}
.ev.bad{color:#ffb4ad}
.ev.warn{color:#e8c46a}
.ev.info{color:var(--sub)}
.ev .tm{font-weight:800;font-size:11.5px;padding:0 5px;border-radius:4px;background:#161b22;flex:none}

/* ── 2D 하이라이트 ─────────────────────────── */
.hl{position:relative;margin-bottom:12px}
.hl canvas{width:100%;display:block;border-radius:10px;background:#0f2415;border:1px solid #24402a}
.hl .cap{position:absolute;left:0;right:0;bottom:0;padding:7px 11px;font-size:13px;font-weight:700;
     background:linear-gradient(0deg,#000c,#0000);border-radius:0 0 10px 10px}
.hl .badge{position:absolute;top:8px;left:10px;background:#000a;border:1px solid #ffffff33;
     border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:800}
/* 리플레이 중임을 분명히 한다 — KM26 의 🎬 배지와 같은 자리 */
.hl .badge.rep{border-color:var(--gold);color:var(--gold)}
.hl .skip{position:absolute;top:8px;right:10px;display:flex;gap:5px}
.hl .skip button{padding:3px 9px;font-size:11.5px;border-radius:6px}
/* 장면이 없는 동안 — 정지된 포메이션이라는 걸 알려 준다 */
.hl.idle canvas{filter:saturate(.75) brightness(.82)}
.hl.idle #hlSkip{display:none}     /* 정지 중에는 건너뛸 것이 없다 — 다시 보기만 남는다 */

/* ── 득점자 패널 (KM26 방식) ─────────────────────────────────
   골이 들어간 순간 GOAL · 득점자 · 도움을 화면 한가운데 큼직하게 띄운다. */
.gp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:5}
.gp.hidden{display:none}
.gpBox{background:rgba(8,12,17,.88);border:2px solid var(--gpCol,var(--acc));
    border-left:10px solid var(--gpCol,var(--acc));border-radius:12px;padding:14px 30px 13px;
    text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.65);
    animation:gpIn .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes gpIn{from{transform:scale(.72) translateY(10px);opacity:0}
                to{transform:scale(1) translateY(0);opacity:1}}
.gpTag{font-size:26px;font-weight:900;letter-spacing:4px;color:var(--gpCol,var(--acc));
    text-shadow:0 0 18px var(--gpCol,var(--acc));line-height:1}
.gpName{font-size:24px;font-weight:800;color:#fff;margin-top:6px;letter-spacing:.5px}
.gpMeta{font-size:13px;color:#dbe3ea;margin-top:4px}
.gpMeta b{color:var(--gold);font-size:15px}
.gpAst{color:#7ee787;margin-left:4px;font-weight:700}
/* 취소된 골 — 커널은 오프사이드로 취소된 골에도 "골" 표시를 붙인다 */
.gpBox.off{border-color:var(--bad);border-left-color:var(--bad)}
.gpName.strike{text-decoration:line-through;color:#ffb4ad}
@media (max-width:760px){
  .gpBox{padding:11px 20px 10px}
  .gpTag{font-size:21px} .gpName{font-size:19px} .gpMeta{font-size:12px}
}
.scene{display:flex;gap:5px;align-items:center}
.scene button{padding:4px 9px;font-size:11.5px;border-radius:6px}
.scene .lb{color:var(--sub);font-size:11.5px;font-weight:700}
.hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;margin-top:8px}
.hlist button{padding:6px 8px;font-size:12px;text-align:left;font-weight:700}
.hlist .k{display:block;font-size:11px;color:var(--sub);font-weight:600}

/* ── 경기 뒤 반응 ──────────────────────────── */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){ .rgrid{grid-template-columns:1fr} }
.rh{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:5px}
.rmsg{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--line);
      border-radius:7px;padding:6px 9px;font-size:12.5px;margin-bottom:5px;line-height:1.5}
.rmsg.up{border-left-color:var(--ok)}
.rmsg.dn{border-left-color:var(--bad)}
.rmsg .nick{color:var(--acc);font-size:11.5px;margin-right:4px}
/* 계정 한 줄 — 이모지 · 이름 · 이 사람이 누구 편인가 */
.rmsg .who{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:2px}
.rmsg .av{font-size:13px}
.rmsg .tx{line-height:1.5}
.rmsg .tag{font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;border:1px solid var(--line);color:var(--sub)}
.rmsg .tag.riv{color:#d2a8ff;border-color:#553a7a}
.rmsg .tag.troll{color:var(--bad);border-color:#6d2b28}
.rmsg .vote{margin-left:auto;font-size:10.5px;color:var(--sub);white-space:nowrap}
/* 타팬 글 — 우리 팬 글과 한눈에 갈라 보이게 */
.rmsg.riv{background:#10131c;border-color:#2b2440}
.rmsg.troll{background:#1b1113;border-color:#5a2b2b}
.rmsg.troll .nick{color:var(--bad)}
.rside{padding:5px 12px;font-size:12.5px}

/* ── 통계 ─────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:5px 8px;border-bottom:1px solid #21262d}
td.k{text-align:center;color:var(--sub);font-size:12px;width:40%}
td.h{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
td.a{text-align:left;font-weight:700;font-variant-numeric:tabular-nums}
.note{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--acc);
      border-radius:6px;padding:9px 11px;font-size:12.5px;color:var(--sub);margin-top:9px}
code{background:var(--bg3);padding:1px 6px;border-radius:4px;color:var(--gold);font-size:12px}
/* ── 진행 버튼 · 화면 이동 ─────────────────────────────────────
   KM26 의 .bigbtn 과 같은 초록 큰 버튼입니다. "다음으로 간다"는 어느 화면에서든
   이 색·이 크기 하나뿐이라, 무엇을 누르면 경기가 시작되는지 헷갈리지 않습니다. */
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:15px 16px;background:var(--ok);color:#04260e;border:none;border-radius:9px;
    font-size:16.5px;font-weight:800;cursor:pointer;text-decoration:none;
    font-family:inherit;line-height:1.3;text-align:center;flex-wrap:wrap}
.go:hover:not(:disabled){filter:brightness(1.08);border-color:transparent}
.go:disabled{opacity:.45;cursor:default;filter:none}
.go .s{font-size:12.5px;font-weight:700;opacity:.75}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.nav a{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line);
    border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--txt);text-decoration:none}
.nav a:hover{border-color:var(--ok);color:var(--ok)}
.nav .sp{flex:1}


/* ── 왼쪽 바 (KM26 #side 구조) ─────────────────────────────────
   넓은 화면에서는 왼쪽 210px 고정, 좁은 화면에서는 위쪽 가로 탭으로 눕는다.
   어느 화면에 있든 다른 화면으로 한 번에 갈 수 있어야 한다. */
#app{display:flex;min-height:100vh}
#side{width:210px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
      padding:14px 10px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
#side h1{font-size:17px;color:var(--gold);margin-bottom:2px}
#side .brand{font-size:11px;color:var(--sub);margin-bottom:14px}
#navScroll{display:contents}
.navbtn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);
        padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px;margin-bottom:2px;
        text-decoration:none;font-weight:600}
.navbtn:hover{background:var(--bg3)}
.navbtn.on{background:var(--acc);color:#fff}
.navbtn .k{display:block;font-size:11px;font-weight:400;opacity:.8}
#side .navsep{margin:12px 2px 6px;font-size:11px;color:var(--sub);font-weight:700}
#mainWrap{flex:1;min-width:0}
#pageMain{padding:20px 22px 60px;max-width:1100px}
@media (max-width:820px){
  #app{display:block}
  #side{width:100%;height:auto;position:sticky;top:0;z-index:900;padding:8px 8px 0;
        border-right:none;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.5);
        display:grid;grid-template-columns:1fr;overflow:visible}
  #side h1{font-size:15px;margin:0}
  #side .brand,#side .navsep{display:none}
  /* 탭은 가로로 눕히고 옆으로 스크롤한다 */
  #navScroll{display:flex;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none}
  #navScroll::-webkit-scrollbar{display:none}
  .navbtn{display:inline-block;width:auto;white-space:nowrap;margin:0;padding:9px 12px;
          background:var(--bg3);border-radius:8px 8px 0 0}
  .navbtn .k{display:none}
  #pageMain{padding:14px 12px 60px}
}

/* ── 대진 고르기 ───────────────────────────────────────────────
   드롭다운을 펼쳐 놓습니다 — 무엇을 고를 수 있는지 한눈에 보이고, 폰에서 두 번 누를 일이
   없습니다. 값의 주인은 그대로 <select> 이고(화면 로직이 전부 그걸 읽습니다) 여기서는
   칩만 그립니다. */
.hidesel{display:none}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){ .sides{grid-template-columns:1fr} }
.sideBox{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.sideBox .sh{font-size:13.5px;font-weight:800;color:var(--gold);margin-bottom:7px}
.sideBox .sh2{font-size:11.5px;font-weight:800;color:var(--sub);margin:11px 0 5px}
.tabs{display:flex;gap:5px;margin-bottom:6px}
.tab{background:var(--bg2);border:1px solid var(--line);color:var(--sub);border-radius:7px;
     padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px}
.chips.src{grid-template-columns:1fr}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);
      border-radius:7px;padding:6px 8px;font-size:12.5px;font-weight:700;cursor:pointer;
      color:var(--txt);text-align:left;min-width:0}
.chip:hover{border-color:var(--acc)}
.chip.on{border-color:var(--acc);background:#12283d;box-shadow:inset 0 0 0 1px var(--acc)}
.chip .b{width:4px;height:16px;border-radius:2px;flex:none}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 코드 붙여넣는 칸 — 눌러서 붙여넣기 하는 자리라 넓게 둔다 */
.codebox{margin-top:8px}
.codebox .cl{font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:4px}
textarea.cin{width:100%;min-height:52px;resize:vertical;background:var(--bg2);color:var(--gold);
     border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;
     font-family:monospace;line-height:1.5}
textarea.cin.bad{border-color:var(--bad);color:var(--bad)}
/* 내 코드 — 상대에게 건넬 것. 초록(진행)과 헷갈리지 않게 금색으로 */
.mycode{background:#1a1608;border:1px solid #5c4a1c;border-left:3px solid var(--gold);
        border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12.5px}
.mycode b{color:var(--gold)}
.mycode .row{margin-top:7px}
.mycode input{flex:1;min-width:220px;background:var(--bg3);color:var(--gold);border:1px solid var(--line);
     border-radius:7px;padding:6px 9px;font-size:12.5px;font-family:monospace}
.spdlb{color:var(--sub);font-size:11.5px;font-weight:700;margin-right:2px}
</style>
</head>
<body>
<div id="app">
<nav id="side">
  <h1>KMD26</h1>
  <div class="brand">개리그 매니저 듀얼</div>
  <div id="navScroll">
    <a class="navbtn" href="index.html">🏠 첫 페이지<span class="k">어떻게 하는 게임인가</span></a>
    <a class="navbtn" href="lineup.html">📋 라인업<span class="k">전술 · 선발 · 대전 코드</span></a>
    <a class="navbtn on" href="match.html">⚽ 경기<span class="k">대전 · 연습 · 2D 재생</span></a>
    <a class="navbtn" href="squad.html">👥 선수단<span class="k">29개 구단 1,024명</span></a>
  </div>
</nav>
<div id="mainWrap"><div id="pageMain">


<div class="top">
  <div><h1>경기</h1><div class="sub" id="meta">불러오는 중…</div></div>
</div>

<div class="card" id="setup">
  <h3>대진</h3>
  <!-- 값의 주인은 이 select 들이다 (화면 로직이 전부 이걸 읽는다). 눈에는 안 보인다. -->
  <select id="homeSel" class="hidesel"></select><select id="homePlan" class="hidesel"></select>
  <select id="awaySel" class="hidesel"></select><select id="awayPlan" class="hidesel"></select>
  <select id="awayAi" class="hidesel"></select>

  <div class="sides">
    <div class="sideBox">
      <div class="sh">🏠 홈 <span class="sub" id="homePick"></span></div>
      <div class="tabs" id="homeTabs">
        <button class="tab on" data-lg="k1">K리그1</button>
        <button class="tab" data-lg="k2">K리그2</button>
      </div>
      <div class="chips" id="homeTeams"></div>
      <div class="sh2">라인업</div>
      <div class="chips src" id="homeSrc"></div>
      <div class="codebox" id="homeCodeBox" style="display:none">
        <div class="cl">코드를 여기에 붙여넣으세요 (Ctrl+V)</div>
        <textarea id="homeCode" class="cin" rows="2" spellcheck="false"
                  placeholder="KM26D1-…"></textarea>
      </div>
    </div>

    <div class="sideBox">
      <div class="sh">✈ 원정 <span class="sub" id="awayPick"></span></div>
      <div class="tabs" id="awayTabs">
        <button class="tab on" data-lg="k1">K리그1</button>
        <button class="tab" data-lg="k2">K리그2</button>
      </div>
      <div class="chips" id="awayTeams"></div>
      <div class="sh2">라인업 · 상대</div>
      <div class="chips src" id="awaySrc"></div>
      <!-- 연습 상대의 전술 (어려움은 상성으로 자동) -->
      <div id="aiBox" style="display:none">
        <div class="sh2">연습 상대 전술</div>
        <div class="chips src" id="aiChips"></div>
      </div>
      <div class="codebox" id="awayCodeBox" style="display:none">
        <div class="cl">상대가 준 코드를 여기에 붙여넣으세요 (Ctrl+V)</div>
        <textarea id="awayCode" class="cin" rows="2" spellcheck="false"
                  placeholder="KM26D1-…"></textarea>
      </div>
    </div>
  </div>
  <button id="start" class="go" style="margin-top:11px">▶ 경기 시작
    <span class="s">90분을 먼저 다 치른 뒤 해설로 재생합니다 (준비 8초)</span></button>
  <div class="note" id="setupNote"></div>
  <!-- 내 코드 — 상대에게 건넬 것. 라인업이 정해지면 바로 뜬다 -->
  <div class="mycode" id="myCode" style="display:none"></div>
</div>

<div id="game" style="display:none">
  <div class="board">
    <div class="side"><span class="bar" id="hCol"></span><span class="nm" id="hName"></span></div>
    <div>
      <div class="score" id="score">0 : 0</div>
      <div class="clock" id="clock">킥오프 대기</div>
    </div>
    <div class="side a"><span class="nm" id="aName"></span><span class="bar" id="aCol"></span></div>
    <div class="bar2"><i id="prog"></i></div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="hl idle" id="hl" style="display:none">
      <canvas id="cv" width="700" height="440"></canvas>
      <div class="gp hidden" id="gp"></div>
      <div class="badge" id="hlBadge"></div>
      <div class="skip">
        <button id="hlReplay" title="이 장면을 느리게 다시 봅니다">↺ 다시 보기</button>
        <button id="hlSkip">건너뛰기 ✕</button>
      </div>
      <div class="cap" id="hlCap"></div>
    </div>
    <div class="row" style="justify-content:space-between;margin-bottom:9px">
      <div class="row">
        <button id="play" class="pri">⏸ 일시정지</button>
        <span class="spdlb">속도</span>
        <button class="spd on" data-s="1">1배속</button>
        <button class="spd" data-s="2">2배속</button>
        <button class="spd" data-s="4">4배속</button>
        <button id="skip">⏭ 끝까지</button>
      </div>
      <div class="scene">
        <span class="lb">장면</span>
        <button class="sc on" data-m="all">결정적 장면 전부</button>
        <button class="sc" data-m="goal">골만</button>
        <button class="sc" data-m="off">안 보기</button>
      </div>
      <div class="row"><button id="again">다시 대진 고르기</button></div>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="card" id="result" style="display:none"></div>
</div>

<script type="module">
import { autoLineup, planSig, sideLabels } from "./src/engine/teams.js?v=271bde54ea";
import { decodePlan, encodePlan, resultLink, parseResultLink } from "./src/codec/duelcode.js?v=271bde54ea";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let DB = null, T = null, R = null;      // R = 경기 결과
let minute = 0, idx = 0, timer = null, speed = 1, playing = false;   // 기본은 1배속

/* 어디까지 장면을 보여 줄지. 클립에는 엔진이 매긴 무게가 붙어 있다
   (결정적 기회 1 · 선방 2 · 퇴장 3 · PK 4 · 골 5 — 커널 HL_W 와 같다). */
let sceneMode = "all";
/* 이 경기를 치른 라인업 두 벌 — 결과 링크를 만들 때 쓴다 (연습은 발급하지 않으므로 null) */
let lastPlans = null;
const SCENE_MIN = { all: 1, goal: 5, off: 99 };

/* 1분을 몇 밀리초에 흘려보낼지. 1배속이면 90분 경기가 1분 12초쯤 걸린다.
   경기를 먼저 다 돌려 놓고 재생만 하므로, 배속은 엔진 속도와 아무 상관이 없다.
   ⚠ 예전 640ms 는 눈으로 따라가기에 빨랐다 — 0.8배로 늦춰 800ms 로 둔다. */
const MS_PER_MIN = 800;

async function boot() {
  try {
    const m = await fetch("data/meta.json", { cache: "no-cache" }).then(r => r.json());
    const v = "?v=" + (m.dataHash || "");
    const [t, p, rx] = await Promise.all([
      fetch("data/teams.json" + v).then(r => r.json()),
      fetch("data/players.json" + v).then(r => r.json()),
      fetch("data/reactions.json" + v).then(r => r.json()).catch(() => null),
    ]);
    DB = { teams: t.teams, order: t.order, players: p, meta: m, react: rx };
    T = t.tables;
  } catch (e) {
    $("#meta").innerHTML = `<span style="color:var(--bad)">데이터를 불러오지 못했습니다 — ${esc(e.message)}</span>`;
    return;
  }
  $("#meta").textContent = `${DB.meta.teamCount}개 구단 · ${DB.meta.playerCount}명`;

  const opts = ["k1", "k2"].map(lg =>
    `<optgroup label="${lg === "k1" ? "K리그1" : "K리그2"}">` +
    DB.order[lg].map(id => `<option value="${id}">${esc(DB.teams[id].short)}</option>`).join("") +
    `</optgroup>`).join("");
  $("#homeSel").innerHTML = opts;
  $("#awaySel").innerHTML = opts;

  // 라인업 화면에서 넘어왔으면 그 팀·전술을 그대로 쓴다
  HAND = loadPlan();
  SLOTS = loadSlots();
  const hid0 = HAND ? HAND.id : DB.order.k1[0];
  $("#homeSel").value = hid0;
  // 처음 열었을 때는 다른 구단끼리 — 같은 구단은 골라야 나오게 한다
  $("#awaySel").value = DB.order.k1.find(id => id !== hid0) || DB.order.k1[0];
  // 고른 팀이 어느 리그인지에 맞춰 탭을 세운다
  for (const sd of ["home", "away"]) {
    LG[sd] = DB.order.k1.includes($(`#${sd}Sel`).value) ? "k1" : "k2";
    drawTeamChips(sd);
  }
  drawPlanSel("home"); drawPlanSel("away");
  // 라인업 화면에서 넘어왔으면 그 칸을 고른 상태로 둔다 (칩 표시까지 맞춘다)
  if (HAND) { $("#homePlan").value = "hand"; drawSrcChips("home"); drawCodeRow(); }
  describe();

  for (const s of ["home", "away"]) {
    $(`#${s}Sel`).onchange = () => { drawTeamChips(s); drawPlanSel(s); describe(); };
    $(`#${s}Tabs`).querySelectorAll(".tab").forEach(t => t.onclick = () => {
      LG[s] = t.dataset.lg; drawTeamChips(s);
    });
    $(`#${s}Plan`).onchange = () => {
      // 칸을 바꾸면 칩의 선택 표시 · 코드 상자 · 연습 전술 칩이 모두 따라와야 한다
      if (s === "away") { drawAiSel(); drawAiChips(); }
      drawSrcChips(s);
      drawCodeRow();
      describe();
    };
  }
  $("#awayAi").onchange = () => { drawAiChips(); describe(); };
  $("#homeCode").oninput = describe;
  $("#awayCode").oninput = describe;

  /* 링크로 들어온 경우 (설계서 4-1)
     #c=<코드>        상대가 건넨 초대 링크 — 그 팀을 원정에 앉힌다
     #m=<코드A>.<코드B>  결과 링크 — 양쪽을 코드로 세워 그 경기를 그대로 재현한다 */
  const mm = parseResultLink(location.hash);
  if (mm) {
    $("#homePlan").value = "code"; $("#awayPlan").value = "code";
    $("#homeCode").value = mm.a; $("#awayCode").value = mm.b;
    drawCodeRow();
  } else {
    const cm = /[#&?]c=([^&#\s]+)/.exec(location.hash || location.search);
    if (cm) {
      $("#awayPlan").value = "code"; $("#awayCode").value = decodeURIComponent(cm[1]);
      drawAiSel(); drawCodeRow();
    }
  }
  describe();
  $("#start").onclick = start;
  $("#again").onclick = () => {
    stop(); stopClip(); lastClip = null;
    $("#hl").style.display = "none";
    $("#game").style.display = "none"; $("#setup").style.display = "";
    // 다른 탭에서 라인업을 새로 저장했을 수 있다 — 목록을 다시 읽는다
    HAND = loadPlan(); SLOTS = loadSlots();
    drawPlanSel("home"); drawPlanSel("away"); describe();
  };
  $("#play").onclick = () => (playing ? pause() : resume());
  $("#skip").onclick = skipToEnd;
  document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
    speed = +b.dataset.s;
    document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b));
    if (playing) { pause(); resume(); }
    startClipTimer();     // 장면을 보고 있었다면 그 자리에서 새 배속으로 이어 돌린다
  });
  document.querySelectorAll(".sc").forEach(b => b.onclick = () => {
    sceneMode = b.dataset.m;
    document.querySelectorAll(".sc").forEach(x => x.classList.toggle("on", x === b));
  });
}

/* ── 라인업 고르기 ────────────────────────────────────────────
   한쪽만 짤 수 있으면 "같은 구단끼리 다른 전술"을 시험할 수 없다.
   양쪽 모두 자동 · 라인업 화면 · 저장 슬롯 열 벌 중에서 고른다.
   단계 5 의 대전 코드가 생기면 상대 쪽 칸을 코드가 대신한다. */
let HAND = null, SLOTS = [];

/** 라인업 화면이 남겨 둔 것 */
function loadPlan() {
  try {
    const s = localStorage.getItem("kmd26.lineup");
    if (!s) return null;
    const p = JSON.parse(s);
    return (p && p.id && DB.teams[p.id] && p.xi) ? p : null;
  } catch (e) { return null; }
}

/** 라인업 화면의 저장 슬롯 열 벌 */
function loadSlots() {
  try {
    const a = JSON.parse(localStorage.getItem("kmd26.slots") || "[]");
    return Array.isArray(a) ? a.filter(s => s && DB.teams[s.id] && s.xi) : [];
  } catch (e) { return []; }
}

/* ── 연습 모드 (단계 A) ────────────────────────────────────────
   상대가 없어도 혼자 전술을 시험한다. 난이도는 **선수 능력치가 아니라 상대 감독의
   유능함**이다 — 라인업을 짜는 솜씨, 후반에 지시를 바꾸는가, 내 전술을 보고
   상성으로 고르는가. 연습은 매 판 새 시드이고 결과 코드를 발급하지 않는다. */
const AI_LV = { easy: "쉬움", normal: "보통", hard: "어려움" };
const AI_TAC = { press: "높은 압박", counter: "역습", wing: "측면 공략" };
const AI_LV_NOTE = {
  easy: "명단 순서대로 세웁니다 — 자리에 안 맞는 선수가 섞입니다. 후반에도 가만히 있습니다.",
  normal: "자리마다 어울리는 선수를 세우고, 후반에 점수를 보고 지시를 바꿉니다.",
  hard: "자리 적합도로 조합 전체를 최적화하고, <b>내 전술을 보고 상성으로</b> 나옵니다.",
};

/** "안양를" 이 되지 않게 — 마지막 글자에 받침이 있으면 을, 없으면 를 */
function josa(name) {
  const c = String(name || "").slice(-1).charCodeAt(0);
  if (!(c >= 0xac00 && c <= 0xd7a3)) return "을";
  return ((c - 0xac00) % 28) !== 0 ? "을" : "를";
}

const isAi = v => String(v || "").startsWith("ai:");
const aiLevelOf = v => String(v || "").slice(3) || "normal";

/* ── 펼쳐서 고르기 ─────────────────────────────────────────────
   드롭다운을 열어 두는 대신 칩을 펼칩니다. <select> 는 값의 주인으로 그대로 두고
   (describe·start 가 전부 그걸 읽습니다) 칩은 그 값을 바꿔 change 를 흘려보냅니다. */
const LG = { home: "k1", away: "k1" };   // 각 칸이 지금 보고 있는 리그

function setSel(id, v) {
  const sel = $(id);
  if (sel.value === v) return;
  sel.value = v;
  sel.dispatchEvent(new Event("change"));
}

function drawTeamChips(side) {
  const cur = $(`#${side}Sel`).value;
  const lg = LG[side];
  $(`#${side}Teams`).innerHTML = DB.order[lg].map(id => {
    const t = DB.teams[id];
    return `<button class="chip${id === cur ? " on" : ""}" data-t="${id}">
      <span class="b" style="background:${esc(t.col)}"></span>
      <span class="t">${esc(t.short)}</span></button>`;
  }).join("");
  $(`#${side}Teams`).querySelectorAll("[data-t]").forEach(b =>
    b.onclick = () => setSel(`#${side}Sel`, b.dataset.t));
  // 고른 팀이 다른 리그에 있으면 탭을 그 리그로 맞춘다
  $(`#${side}Pick`).textContent = DB.teams[cur] ? DB.teams[cur].short : "";
  $(`#${side}Tabs`).querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("on", t.dataset.lg === lg));
}

function drawSrcChips(side) {
  const sel = $(`#${side}Plan`), cur = sel.value;
  $(`#${side}Src`).innerHTML = [...sel.options].map(o =>
    `<button class="chip${o.value === cur ? " on" : ""}" data-s="${esc(o.value)}">
       <span class="t">${esc(o.text)}</span></button>`).join("");
  $(`#${side}Src`).querySelectorAll("[data-s]").forEach(b =>
    b.onclick = () => setSel(`#${side}Plan`, b.dataset.s));
}

function drawAiChips() {
  const sel = $("#awayAi"), on = isAi($("#awayPlan").value);
  $("#aiBox").style.display = on ? "" : "none";
  if (!on) return;
  const cur = sel.value;
  $("#aiChips").innerHTML = [...sel.options].map(o =>
    `<button class="chip${o.value === cur ? " on" : ""}" data-a="${esc(o.value)}"
       ${sel.disabled ? "disabled" : ""}><span class="t">${esc(o.text)}</span></button>`).join("");
  $("#aiChips").querySelectorAll("[data-a]").forEach(b =>
    b.onclick = () => setSel("#awayAi", b.dataset.a));
}

/* 내 코드 — 상대에게 건넬 것. 홈 라인업이 정해지면 바로 띄운다(라인업 화면에서 넘어온 경우 포함).
   초록(진행)과 헷갈리지 않게 금색으로 둔다. */
function drawMyCode() {
  const box = $("#myCode");
  const hSrc = $("#homePlan").value;
  if (hSrc === "code") { box.style.display = "none"; return; }   // 코드로 받은 건 내 것이 아니다
  let code = "";
  try {
    code = encodePlan(planFor($("#homeSel").value, hSrc), codeCtx());
  } catch (e) { box.style.display = "none"; return; }
  box.style.display = "";
  box.innerHTML = `<b>🔗 내 대전 코드</b> — 상대에게 건네세요. 상대 코드를 받아 원정 칸에 넣으면
    둘이 같은 경기를 봅니다.
    <div class="row">
      <input id="myCodeTxt" readonly value="${esc(code)}">
      <button id="myCodeCopy">복사</button>
    </div>`;
  $("#myCodeCopy").onclick = () => {
    const t = $("#myCodeTxt"); t.select();
    navigator.clipboard?.writeText(t.value).then(
      () => { $("#myCodeCopy").textContent = "복사됨 ✓";
              setTimeout(() => { const b = $("#myCodeCopy"); if (b) b.textContent = "복사"; }, 1600); },
      () => { $("#myCodeCopy").textContent = "Ctrl+C"; });
  };
}

/** 그 구단으로 쓸 수 있는 라인업 목록 */
function planSources(teamId, side) {
  const out = [{ v: "auto", t: "자동 라인업" }];
  if (HAND && HAND.id === teamId) out.push({ v: "hand", t: "라인업 화면에서 짠 것" });
  SLOTS.forEach((s, i) => {
    if (s.id === teamId) out.push({ v: "slot:" + i, t: `저장 ${i + 1}번 · ${s.formation || ""}`.trim() });
  });
  // 대전 코드 — 상대가 건넨 51자를 그대로 붙여 넣는다 (양쪽 다 가능: 남의 경기 검증도 된다)
  out.push({ v: "code", t: "🔗 대전 코드 붙여넣기" });
  // 원정 쪽에만 연습 상대를 둔다 — 홈은 언제나 내가 짠 팀이다
  if (side === "away") {
    for (const k of ["easy", "normal", "hard"]) out.push({ v: "ai:" + k, t: `🤖 연습 · ${AI_LV[k]}` });
  }
  return out;
}

/** 코드 상자를 쓰는 쪽만 보여 준다 */
function drawCodeRow() {
  $("#homeCodeBox").style.display = $("#homePlan").value === "code" ? "" : "none";
  $("#awayCodeBox").style.display = $("#awayPlan").value === "code" ? "" : "none";
}

/**
 * 코드 한 장 → 라인업. 구단·포메이션·역할까지 코드가 다 들고 있으므로
 * 화면의 구단 선택은 코드에 맞춰 따라간다.
 */
function planFromCode(side) {
  const box = $(`#${side}Code`);
  const raw = (box.value || "").trim();
  if (!raw) throw new Error(`${side === "home" ? "홈" : "원정"} 코드를 넣어 주세요`);
  const p = decodePlan(raw, codeCtx());
  const sel = $(`#${side}Sel`);
  if (sel.value !== p.id) { sel.value = p.id; drawPlanSel(side); }
  return p;
}

function codeCtx() {
  return { order: DB.order, tables: T, players: DB.players, dataHash: DB.meta.dataHash };
}

function drawPlanSel(side) {
  const sel = $(`#${side}Plan`), keep = sel.value;
  const list = planSources($(`#${side}Sel`).value, side);
  sel.innerHTML = list.map(o => `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join("");
  if (list.some(o => o.v === keep)) sel.value = keep;
  if (side === "away") drawAiSel();
  drawCodeRow();
  drawSrcChips(side);
  if (side === "away") drawAiChips();
}

/** 연습 상대의 전술 프리셋 칸 — 어려움은 상성으로 고르므로 고를 것이 없다 */
function drawAiSel() {
  const box = $("#awayAi"), src = $("#awayPlan").value;
  if (!isAi(src)) { box.style.display = "none"; return; }
  box.style.display = "";
  const hard = aiLevelOf(src) === "hard";
  const keep = box.value;
  box.innerHTML = hard
    ? `<option value="auto">상성으로 자동</option>`
    : Object.keys(AI_TAC).map(k => `<option value="${k}">${esc(AI_TAC[k])}</option>`).join("");
  box.disabled = hard;
  if (!hard && Object.keys(AI_TAC).includes(keep)) box.value = keep;
}

/* 옛 저장본에는 포메이션이 안 담겨 있다 — 자리 이름 묶음으로 되찾는다.
   되찾지 못하면 커널이 4-3-3 모양을 기준으로 남은 자리를 채운다(배치 자체는 지켜진다). */
function formationOf(xiMap) {
  const have = Object.keys(xiMap || {}).filter(s => s !== "GK").sort().join(",");
  for (const f of Object.keys(T.formation))
    if (T.formation[f].map(s => s[1]).sort().join(",") === have) return f;
  return "4-3-3";
}

/** 화면이 쓰는 라인업 모양 → 일꾼에게 넘길 모양 */
function planFor(teamId, src) {
  const saved = src === "hand" ? HAND
    : (String(src).startsWith("slot:") ? SLOTS[+String(src).slice(5)] : null);
  if (saved && saved.id === teamId) {
    const xiMap = saved.xi;
    return { id: teamId, xiMap, xi: Object.values(xiMap), bench: saved.bench || [],
             // 포메이션은 시드에도 들어가야 하므로 전술 안에 넣어 둔다
             tac: Object.assign({}, saved.tac,
                  { formation: saved.formation || (saved.tac || {}).formation || formationOf(xiMap) }),
             roles: saved.roles || {},
             cond: Array.isArray(saved.cond) ? saved.cond : [] };
  }
  const { xi, bench } = autoLineup(DB.players[teamId], T, "4-3-3");
  return { id: teamId, xiMap: xi, xi: Object.values(xi), bench,
           tac: { formation: "4-3-3" }, roles: {}, cond: [] };
}

/** 지금 고른 대진이 어떤 경기가 될지 한 줄로 알려 준다 */
function describe() {
  const hid = $("#homeSel").value, aid = $("#awaySel").value;
  const aSrc = $("#awayPlan").value;

  // 연습 경기 — 상대는 AI 감독이 짠다. 라인업 지문을 견줄 것이 없으므로 따로 안내한다
  if (isAi(aSrc)) {
    const lv = aiLevelOf(aSrc);
    const tacN = lv === "hard" ? "내 전술을 보고 고릅니다" : AI_TAC[$("#awayAi").value] || "높은 압박";
    $("#setupNote").innerHTML = `
      <b>🤖 연습 경기</b> — ${esc(DB.teams[aid].short)}${josa(DB.teams[aid].short)} <b>${esc(AI_LV[lv])}</b> AI 감독이 맡습니다
      (전술: ${esc(tacN)}).<br>${AI_LV_NOTE[lv]}
      <br><span class="sub">난이도는 선수 능력치를 건드리지 않습니다 — 상대 감독의 솜씨만 달라집니다.
      연습은 <b>매 판 새 시드</b>라 같은 라인업으로도 다른 경기가 나오고, 결과 코드는 발급하지 않습니다.</span>`;
    drawMyCode();
    return;
  }

  let hp, ap;
  try {
    hp = $("#homePlan").value === "code" ? planFromCode("home") : planFor(hid, $("#homePlan").value);
    ap = aSrc === "code" ? planFromCode("away") : planFor(aid, aSrc);
  } catch (e) {
    // 코드가 잘못됐으면 조용히 다른 라인업으로 해석하지 않고 그 자리에서 알린다 (설계서 4-2)
    $("#setupNote").innerHTML = `<span style="color:var(--bad)">코드를 읽지 못했습니다 — ${esc(e.message)}</span>`;
    $("#homeCode").classList.toggle("bad", $("#homePlan").value === "code");
    $("#awayCode").classList.toggle("bad", aSrc === "code");
    return;
  }
  $("#homeCode").classList.remove("bad"); $("#awayCode").classList.remove("bad");
  const same = hp.id === ap.id;
  const note = [];
  if (same) {
    note.push(planSig(hp) === planSig(ap)
      ? `<span style="color:var(--bad)">양 팀의 선수·전술이 완전히 같습니다 —
         라인업이나 전술을 한 가지라도 바꿔 주세요.</span>`
      : `같은 구단끼리의 대전입니다 — 이름표에 <b>(홈)</b>·<b>(어웨이)</b> 를 붙이고
         원정 쪽은 원정 유니폼 색으로 그립니다.`);
  }
  if (!HAND && !SLOTS.length)
    note.push(`양쪽 모두 <b>자동 라인업</b>입니다.
      <a href="lineup.html">라인업 화면</a>에서 짜 두면 여기서 골라 쓸 수 있습니다.`);
  else
    note.push(`라인업은 칸마다 따로 고릅니다 — 자동 · 라인업 화면에서 짠 것 ·
      저장 슬롯. 그 구단으로 저장한 것만 목록에 나옵니다.`);
  $("#setupNote").innerHTML = note.join("<br>");
  drawMyCode();
}

function start() {
  const hid = $("#homeSel").value, aid = $("#awaySel").value;
  const aSrc = $("#awayPlan").value;
  const practice = isAi(aSrc);
  let hp;
  try { hp = $("#homePlan").value === "code" ? planFromCode("home") : planFor(hid, $("#homePlan").value); }
  catch (e) { describe(); return; }

  /* 연습이면 상대 라인업은 일꾼이 짠다(AI 감독). "어려움"이 쓰는 slotRating 이
     커널 함수라 화면에서는 부를 수 없기 때문이다. */
  let ap;
  try {
    ap = practice
      ? { id: aid, tables: T, ai: { id: aid, level: aiLevelOf(aSrc), preset: $("#awayAi").value } }
      : (aSrc === "code" ? planFromCode("away") : planFor(aid, aSrc));
  } catch (e) { describe(); return; }
  // 코드가 구단을 정하므로 전광판은 코드가 가리키는 구단으로 그린다
  const hid2 = hp.id, aid2 = ap.id;

  /* 같은 구단끼리는 붙을 수 있다 — 선수와 전술이 다르면 다른 팀이다.
     다만 라인업 지문까지 똑같으면 두 팀을 가릴 것이 없다(일꾼도 같은 이유로 막는다). */
  if (!practice && planSig(hp) === planSig(ap)) { describe(); return; }

  stopClip(); $("#hl").style.display = "none";
  $("#setup").style.display = "none";
  $("#game").style.display = "";
  $("#result").style.display = "none";
  logSet(`<div class="ev info"><span class="m"></span><span class="x">경기를 준비하고 있습니다… (8초쯤 걸립니다)</span></div>`);
  $("#score").textContent = "0 : 0";
  $("#clock").textContent = "계산 중";
  $("#prog").style.width = "0%";
  // 전광판은 결과가 오기 전에도 켜진다 — 같은 구단이면 여기서도 이름표를 갈라 둔다
  const L = hid2 === aid2 ? sideLabels(DB.teams[hid2]) : null;
  paintTeams(L ? L.h : DB.teams[hid2], L ? L.a : DB.teams[aid2]);

  const w = new Worker("src/engine/matchworker.js?v=271bde54ea", { type: "module" });
  w.onmessage = e => {
    w.terminate();
    if (!e.data.ok) {
      logSet(`<div class="ev bad"><span class="m"></span><span class="x">경기를 치르지 못했습니다 — ${esc(e.data.error)}</span></div>`);
      return;
    }
    R = e.data;
    paintTeams(R.home, R.away);
    minute = 0; idx = 0;
    logSet("");
    // 킥오프 포메이션을 세워 둔다 — 장면이 나오기 전에도, 0:0 경기에서도 필드가 보인다
    showIdle(R.form0, "킥오프");
    resume();
  };
  w.onerror = ev => {
    w.terminate();
    logSet(`<div class="ev bad"><span class="m"></span><span class="x">일꾼 오류 — ${esc(ev.message || "알 수 없음")}</span></div>`);
  };
  lastPlans = practice ? null : { hp, ap };

  w.postMessage({
    teams: DB.teams, players: DB.players, reactions: DB.react,
    home: hp, away: ap,
    // 연습은 매 판 새 시드 — 같은 판만 반복되면 연습이 되지 않는다(설계서 단계 A)
    seed: practice ? (Math.floor(Math.random() * 0xffffffff) >>> 0) || 1 : 0,
  });
}

function paintTeams(h, a) {
  $("#hCol").style.background = h.col; $("#hName").textContent = h.short;
  $("#aCol").style.background = a.col; $("#aName").textContent = a.short;
}

/* ── 재생 ─────────────────────────────────────────────────────
   경기는 이미 다 끝나 있다. 여기서는 이벤트를 분 단위로 풀어놓기만 한다. */
function resume() {
  if (!R || playing) return;
  playing = true;
  $("#play").textContent = "⏸ 일시정지";
  timer = setInterval(tick, MS_PER_MIN / speed);
}
function pause() {
  playing = false;
  $("#play").textContent = "▶ 재생";
  clearInterval(timer); timer = null;
}
function stop() { pause(); R = null; }

function tick() {
  if (!R) return pause();
  minute++;
  // "90+3" 같은 추가시간 표기는 90 이후로 몰아서 푼다
  const minOf = e => (typeof e.min === "number" ? e.min : 90 + (parseInt(String(e.min).split("+")[1], 10) || 0));
  let shown = false, big = null;
  while (idx < R.events.length && minOf(R.events[idx]) <= minute) {
    const e = R.events[idx++];
    push(e); shown = true;
    // 골 해설이 있으면 그 문장을 장면 자막으로 쓴다
    if (!big && (e.type === "goal" || e.type === "big")) big = e;
  }
  $("#clock").textContent = minute >= 90 ? `90+${minute - 90}분` : `${minute}분`;
  $("#prog").style.width = Math.min(100, minute / 90 * 100) + "%";
  if (shown) $("#log").scrollTop = 0;

  /* 이 분에 볼만한 장면이 있으면 시계를 멈추고 보여 준다.
     골만 보던 것을 넓혔다 — 선방·결정적 기회도 필드에서 벌어진 일이다. */
  const c = clipAt(minute);
  if (c) {
    c._seen = true;
    pause();                         // 장면을 보는 동안 시계는 멈춘다
    playClip(c, big && big.txt ? big.txt : `${c.min}' ${kindLabel(c)}`,
             () => { freezeField(c); resume(); });
    return;
  }
  if (idx >= R.events.length && minute >= 90) finish();
}

/* 로그는 안쪽 상자(.in)에 쌓는다 — "아래에 붙이기"(margin-top:auto)가 그 상자에 걸려 있다.
   새 줄은 맨 위에 붙는다 — 필드 화면 바로 아래가 언제나 가장 새 소식이 된다. */
function logBox() {
  let box = $("#log > .in");
  if (!box) { box = document.createElement("div"); box.className = "in"; $("#log").appendChild(box); }
  return box;
}
function logSet(html) { $("#log").innerHTML = `<div class="in">${html}</div>`; }

function push(e) {
  const row = document.createElement("div");
  row.className = "ev " + (e.type || "txt");
  row.innerHTML = `<span class="m">${e.noTime ? "" : esc(String(e.min ?? "")) + "'"}</span>
    ${e.t ? `<span class="tm" style="color:${esc(e.col || "#a9b4c0")}">${esc(e.t)}</span>` : ""}
    <span class="x">${esc(e.txt || "")}</span>`;
  logBox().prepend(row);
  // 전광판은 그 줄이 공개되는 순간의 점수를 따른다 — 골보다 먼저 올라가지 않게
  if (e.hg != null) $("#score").textContent = `${e.hg} : ${e.ag}`;
}

function skipToEnd() {
  if (!R) return;
  stopClip(); onClipEnd = null;          // 보고 있던 장면은 접는다
  while (idx < R.events.length) push(R.events[idx++]);
  minute = 90;
  $("#log").scrollTop = 0;
  freezeField(lastClip);
  finish();
}

function finish() {
  pause();
  $("#clock").textContent = "경기 종료";
  $("#prog").style.width = "100%";
  $("#score").textContent = `${R.home.goals} : ${R.away.goals}`;

  const s = R.stats, h = s.h, a = s.a;
  const line = (k, hv, av) => `<tr><td class="h">${hv}</td><td class="k">${k}</td><td class="a">${av}</td></tr>`;
  $("#result").style.display = "";
  $("#result").innerHTML = `
    <h3>경기 기록</h3>
    <table>
      ${line("점유율", R.possession.h + "%", R.possession.a + "%")}
      ${line("슈팅", h.shot, a.shot)}
      ${line("유효 슈팅", h.shotOn, a.shotOn)}
      ${line("패스", h.pass, a.pass)}
      ${line("패스 성공률", pct(h.passOk, h.pass), pct(a.passOk, a.pass))}
      ${line("태클", h.tackle, a.tackle)}
      ${line("파울", h.foul, a.foul)}
      ${line("경고 · 퇴장", `${h.yellow} · ${h.red}`, `${a.yellow} · ${a.red}`)}
      ${line("코너", h.corner, a.corner)}
      ${line("오프사이드", h.offside, a.offside)}
      ${line("크로스", h.cross, a.cross)}
    </table>
    ${R.goalLine.length ? `<div class="note"><b>득점</b> — ${
      R.goalLine.map(g => `${g.min}' ${esc(g.n || "")}
        <span class="sub">(${esc(g.side === "h" ? R.home.short : R.away.short)})</span>`).join(" · ")}</div>` : ""}
    <div class="note">
      주심 ${esc(R.referee || "-")} · 계산 ${R.elapsedMs}ms
      <br>시드 <code>${R.seed.toString(16)}</code> · 결과 지문 <code>${esc(R.fp)}</code>
      <br><span class="sub">${R.practice
        ? `🤖 <b>연습 경기</b>입니다 — 상대는 ${esc((R.ai && AI_LV[R.ai.level]) || "")} AI 감독이
           ${esc((R.ai && R.ai.presetName) || "")}(으)로 맡았습니다.
           연습은 매 판 새 시드라 다시 누르면 다른 경기가 나옵니다. 결과 코드는 발급하지 않습니다.`
        : `같은 라인업끼리 붙으면 언제 어디서 돌려도 이 지문이 나옵니다.
           단계 5에서 이 값이 대전 코드에 담깁니다.`}</span>
    </div>
    ${drawResultLink()}
    ${drawHighlightList()}
    ${drawReactions()}`;

  $("#result").querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    const c = R.clips[+b.dataset.c];
    playClip(c, `${c.min}' ${kindLabel(c)}`, () => freezeField(c));
    $("#hl").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  const cr = $("#copyRes");
  if (cr) cr.onclick = () => {
    const t = $("#resLink"); t.select();
    navigator.clipboard?.writeText(t.value).then(
      () => { cr.textContent = "복사됨 ✓"; setTimeout(() => { cr.textContent = "복사"; }, 1600); },
      () => { cr.textContent = "Ctrl+C"; });
  };
  bindReactions();
}

const pct = (ok, n) => (n ? Math.round(ok / n * 100) + "%" : "-");

/* ── 2D 하이라이트 ────────────────────────────────────────────
   90분 전체를 그리지 않는 이유: 해설 재생이 90분을 1분 12초에 흘려보내므로
   1분에 150장을 그려야 합니다. 사람이 볼 수 있는 속도가 아닙니다.
   엔진이 markHighlight() 로 짚어 둔 결정적 장면만 앞뒤로 잘라 보여 줍니다. */
const KIND_N = { goal: "골", miss: "결정적 기회", save: "선방", pen: "페널티킥", red: "퇴장" };
let clipTimer = null, onClipEnd = null, lastClip = null;

/* 리플레이 — KM26 과 같은 규격입니다 (index.html 의 HL_REPLAY_*).
   골 순간 앞 6초·뒤 2.5초를 0.62배속으로. 느려야 무슨 일이 있었는지 눈이 따라갑니다. */
const FRAME_MS = 50;                 // 엔진 한 장(0.2초)을 뿌리는 간격 (0.8배로 늦춘 값)
const REPLAY_PRE = 30, REPLAY_POST = 13, REPLAY_RATE = 0.62;

/* ── 필드 그리기 ───────────────────────────────────────────────
   선·비율은 KM26 drawPitchBase 를 따릅니다 — 골 에어리어와 골대까지 있어야
   "골문 앞"이 어디인지 눈에 들어옵니다. */
function drawPitch(g, W, H, PAD) {
  const X = x => PAD + x * (W - PAD * 2);
  const Y = y => PAD + y * (H - PAD * 2);
  const pw = X(1) - X(0), ph = Y(1) - Y(0);

  g.fillStyle = "#12301b"; g.fillRect(0, 0, W, H);
  // 잔디 줄무늬 — 공이 어디쯤인지 눈으로 가늠하게 해 준다
  g.fillStyle = "#14351e";
  for (let i = 0; i < 8; i += 2) g.fillRect(X(i / 8), 0, pw / 8, H);

  g.strokeStyle = "#ffffff44"; g.lineWidth = 1.6;
  g.strokeRect(X(0), Y(0), pw, ph);
  g.beginPath(); g.moveTo(X(.5), Y(0)); g.lineTo(X(.5), Y(1)); g.stroke();
  g.beginPath(); g.arc(X(.5), Y(.5), ph * 0.16, 0, 7); g.stroke();
  g.beginPath(); g.arc(X(.5), Y(.5), 2.6, 0, 7); g.fillStyle = "#ffffff88"; g.fill();

  for (const right of [false, true]) {
    const bw = pw * 0.16, gw = pw * 0.06, gd = 6;            // 박스 · 골에어리어 · 골대 깊이
    const bx = right ? X(1) - bw : X(0), gx = right ? X(1) - gw : X(0);
    g.strokeRect(bx, Y(.25), bw, ph * 0.5);                   // 페널티 박스
    g.strokeRect(gx, Y(.38), gw, ph * 0.24);                  // 골 에어리어
    g.strokeRect(right ? X(1) : X(0) - gd, Y(.43), gd, ph * 0.14);  // 골대
    // 페널티 스폿
    g.beginPath(); g.arc(right ? X(1) - pw * 0.105 : X(0) + pw * 0.105, Y(.5), 2, 0, 7); g.fill();
  }
}

function drawFrame(f) {
  const cv = $("#cv"), g = cv.getContext("2d");
  const W = cv.width, H = cv.height, PAD = 16;
  const X = x => PAD + x * (W - PAD * 2);
  const Y = y => PAD + y * (H - PAD * 2);

  drawPitch(g, W, H, PAD);
  if (!f) return;

  // 선수 — 홈은 왼쪽에서 오른쪽으로 공격한다. 크기는 KM26 바둑알에 맞췄다.
  for (let i = 0; i + 2 < f.a.length; i += 3) {
    const id = f.a[i], x = f.a[i + 1], y = f.a[i + 2];
    const p = R.roster[id] || {};
    const home = p.side === "h";
    const col = p.gk ? "#e3b341" : (home ? R.home.col : R.away.col);
    const r = p.gk ? 11.5 : 10.5;
    g.beginPath(); g.arc(X(x), Y(y), r, 0, 7);
    g.fillStyle = col; g.fill();
    g.lineWidth = 1.6; g.strokeStyle = "#0009"; g.stroke();
    if (id === f.o) {                    // 공을 가진 선수 — 흰 링
      g.beginPath(); g.arc(X(x), Y(y), r + 4, 0, 7);
      g.strokeStyle = "#fff"; g.lineWidth = 2.2; g.stroke();
    }
    if (p.no !== "" && p.no != null) {
      // 밝은 유니폼에는 검은 글씨 — 등번호가 묻히지 않게 (KM26 과 같은 판정)
      g.fillStyle = isLight(col) ? "#0b0f14" : "#fff";
      g.font = "bold 11px system-ui,sans-serif"; g.textAlign = "center";
      g.fillText(String(p.no), X(x), Y(y) + 4);
    }
  }
  // 심판
  g.beginPath(); g.arc(X(f.r[0]), Y(f.r[1]), 5.5, 0, 7);
  g.fillStyle = "#1c1c1c"; g.fill(); g.strokeStyle = "#ffffff55"; g.lineWidth = 1; g.stroke();
  // 공 — 높이가 있으면 그림자와 함께 띄운다
  const bz = f.b[2] || 0, lift = Math.min(16, bz * 90);
  if (lift > 1) {
    g.beginPath(); g.ellipse(X(f.b[0]), Y(f.b[1]), 4.2, 2.2, 0, 0, 7);
    g.fillStyle = "#0006"; g.fill();
  }
  g.beginPath(); g.arc(X(f.b[0]), Y(f.b[1]) - lift, 5 + lift * 0.08, 0, 7);
  g.fillStyle = "#fff"; g.fill();
  g.strokeStyle = "#0008"; g.lineWidth = 1; g.stroke();
}

/** 유니폼 색이 밝은가 — 등번호 글씨색을 뒤집는 기준 */
function isLight(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
  if (!m) return false;
  const n = parseInt(m[1], 16);
  return (((n >> 16 & 255) * 299 + (n >> 8 & 255) * 587 + (n & 255) * 114) / 1000) > 150;
}

/* ── 장면 재생 ─────────────────────────────────────────────────
   장면이 없는 동안에도 필드는 그대로 서 있습니다. 0:0 경기에서 빈 화면만
   보이던 것을 고친 것이고, 시간이 흐르는 동안은 마지막 장면에서 정지합니다. */
function showIdle(frame, label) {
  $("#hl").style.display = "";
  $("#hl").classList.add("idle");
  $("#hlBadge").textContent = label || "";
  $("#hlBadge").classList.remove("rep");
  $("#hlCap").textContent = "";
  // 본 장면이 있으면 손으로 다시 볼 수 있다
  $("#hlReplay").style.display = lastClip ? "" : "none";
  drawFrame(frame || null);
}

/** 장면이 끝났다 — 마지막 프레임을 그대로 세워 둔다 */
function freezeField(c) {
  lastClip = c || lastClip;
  const f = lastClip && lastClip.frames.length ? lastClip.frames[lastClip.frames.length - 1] : null;
  showIdle(f, lastClip ? `${lastClip.min}' ${kindLabel(lastClip)} — 정지` : "");
}

/**
 * 클립 한 편을 재생한다. 끝나면 done()
 * @param {object} o { replay:true } 면 느리게 돌리고 🎬 배지를 단다
 *
 * ⚠ 재생 상태를 cur 에 들고 있는 이유: 배속을 바꿀 때 **보고 있던 장면의 남은 부분**부터
 *   새 간격으로 이어 돌려야 한다. 예전에는 장면 재생이 늘 40ms 고정이라, 장면이 스무 개쯤
 *   되는 경기에서는 전체 시간이 장면에 지배돼 1·2·4배속 차이가 느껴지지 않았다.
 */
let cur = null;

function playClip(c, caption, done, o = {}) {
  stopClip();
  lastClip = c;
  $("#hl").style.display = "";
  $("#hl").classList.remove("idle");
  $("#hlBadge").textContent = o.replay ? "🎬 다시보기" : `${c.min}' ${kindLabel(c)}`;
  $("#hlBadge").classList.toggle("rep", !!o.replay);
  $("#hlCap").textContent = caption || "";
  onClipEnd = done;
  cur = { c, caption, done, replay: !!o.replay, frames: o.frames || c.frames, i: 0 };
  startClipTimer();
}

/** 지금 배속으로 장면 타이머를 (다시) 건다 */
function startClipTimer() {
  if (clipTimer) { clearInterval(clipTimer); clipTimer = null; }
  if (!cur) return;
  // 엔진 한 장 = 0.2초. 배속은 KM26 처럼 장면 재생에도 곱한다(HL_RATE × 배속).
  // 리플레이는 그 위에 0.62 를 더 곱해 일부러 느리게 본다.
  const ms = Math.max(8, Math.round(FRAME_MS / speed / (cur.replay ? 1 / REPLAY_RATE : 1)));
  clipTimer = setInterval(() => {
    const s = cur;
    if (!s) { stopClip(); return; }
    if (s.i >= s.frames.length) {
      const { c, done, replay } = s;
      stopClip();
      // 골은 KM26 처럼 한 번 더 — 골 순간을 가운데 두고 느리게. 리플레이는 되풀이하지 않는다.
      if (!replay && c.kind === "goal" && !isNoGoal(c)) {
        const rf = replayFrames(c);
        if (rf) { playClip(c, "🎬 다시 보겠습니다.", done, { replay: true, frames: rf }); return; }
      }
      hideGoalPanel();
      if (done) done();
      return;
    }
    drawFrame(s.frames[s.i]);
    // 골이 들어가는 순간부터 득점자를 띄운다 — 빌드업 중에 띄우면 결과를 미리 알려 준다
    if (!s.replay && s.c.kind === "goal" && s.i === (s.c.trig != null ? s.c.trig : 0)) showGoalPanel(s.c);
    s.i++;
  }, ms);
}

/* ── 득점자 패널 ───────────────────────────────────────────────
   KM26 이 골 순간 화면 가운데에 띄우는 그 패널입니다. 득점자와 도움을 크게 보여 줍니다.
   ⚠ 빌드업이 재생되는 내내 띄워 두면 결과를 미리 알려 주는 꼴이 됩니다 —
     골이 들어가는 프레임(clip.trig)에 닿는 순간부터 띄우고, 장면이 끝나면 걷습니다.
     리플레이는 "이미 아는 장면"이라 띄우지 않습니다. */
function goalOf(c) {
  // 클립과 득점 기록을 분·팀으로 맞춘다 (엔진 시계와 해설 분이 한 칸 어긋날 수 있다)
  return (R.goalLine || []).find(g =>
    g.side === c.side && Math.abs((g.min || 0) - c.min) <= 1) || null;
}

/* ⚠ 커널은 **오프사이드·VAR 로 취소된 골에도** markHighlight("goal") 을 붙인다
   (GOAL_OFF 경로). 득점 기록(goalLine)에 없으면 취소된 것이다 —
   그걸 "골"이라고 띄우면 있지도 않은 득점을 알리는 꼴이 된다. */
const isNoGoal = c => c.kind === "goal" && !goalOf(c);
const kindLabel = c => isNoGoal(c) ? "득점 취소" : (KIND_N[c.kind] || c.kind);

function showGoalPanel(c) {
  const g = goalOf(c);
  const team = c.side === "h" ? R.home : R.away;
  const el = $("#gp");
  el.style.setProperty("--gpCol", g ? (team.col || "#2ea8ff") : "#f85149");
  el.innerHTML = g
    ? `<div class="gpBox">
         <div class="gpTag">GOAL!</div>
         <div class="gpName">${esc(g.n || "득점")}</div>
         <div class="gpMeta"><b>${c.min}'</b> · ${esc(team.short)}${
           g.a ? `<span class="gpAst">도움 ${esc(g.a)}</span>` : ""}</div>
       </div>`
    : `<div class="gpBox off">
         <div class="gpTag">NO GOAL</div>
         <div class="gpName strike">${esc(team.short)}</div>
         <div class="gpMeta"><b>${c.min}'</b> · 🚩 <b style="color:#ff7b72">득점 취소</b></div>
       </div>`;
  el.classList.remove("hidden");
}

function hideGoalPanel() {
  const el = $("#gp");
  if (el) { el.classList.add("hidden"); el.innerHTML = ""; }
}

/** 리플레이로 쓸 구간을 잘라 온다 — 너무 짧으면 리플레이를 걸지 않는다 */
function replayFrames(c) {
  const t = c.trig != null ? c.trig : Math.floor(c.frames.length * 0.6);
  const from = Math.max(0, t - REPLAY_PRE), to = Math.min(c.frames.length, t + REPLAY_POST);
  const rf = c.frames.slice(from, to);
  return rf.length >= 8 ? rf : null;
}

function stopClip() {
  if (clipTimer) clearInterval(clipTimer);
  clipTimer = null; cur = null;
  hideGoalPanel();
}

// 건너뛰기 — 보고 있던 장면을 접고 시계를 다시 흘린다 (필드는 그대로 둔다)
$("#hlSkip").onclick = () => {
  const f = onClipEnd;
  stopClip(); onClipEnd = null;
  freezeField(lastClip);
  if (f) f();
};
// 손으로 다시 보기 — 골이면 리플레이 구간, 아니면 장면 전체를 다시 돌린다
$("#hlReplay").onclick = () => {
  if (!lastClip) return;
  const wasPlaying = playing;
  pause();
  const rf = lastClip.kind === "goal" ? replayFrames(lastClip) : null;
  playClip(lastClip, "🎬 다시 보겠습니다.", () => { freezeField(lastClip); if (wasPlaying) resume(); },
           { replay: true, frames: rf || lastClip.frames });
};

/**
 * 지금 분까지 아직 안 본 장면 중 가장 볼만한 것.
 * 분이 정확히 맞지 않아도(엔진 시계와 해설 분이 한 칸 어긋날 수 있다) 지나간 장면은 챙긴다.
 */
function clipAt(min) {
  if (!R || !R.clips) return null;
  const floor = SCENE_MIN[sceneMode] || 1;
  let best = null;
  for (const c of R.clips) {
    if (c._seen || c.min > min || (c.weight || 1) < floor) continue;
    // 이른 장면부터 순서대로. 같은 분에 겹치면 무게가 큰 쪽(골 > PK > 퇴장 > 선방 > 기회)
    if (!best || c.min < best.min ||
        (c.min === best.min && (c.weight || 1) > (best.weight || 1))) best = c;
  }
  return best;
}

/* ── 결과 링크 (단계 5) ────────────────────────────────────────
   코드 두 개만 있으면 누구나 같은 경기를 재현합니다 — 제3자 중재도 됩니다.
   양쪽 값이 다르면 조작이 드러나므로 결과 지문을 함께 적어 둡니다(설계서 2-3). */
function drawResultLink() {
  if (!lastPlans) return "";           // 연습 경기는 발급하지 않는다
  let a, b;
  try {
    a = encodePlan(lastPlans.hp, codeCtx());
    b = encodePlan(lastPlans.ap, codeCtx());
  } catch (e) { return ""; }
  const link = resultLink(a, b);
  return `<h3 style="margin-top:14px">🔗 결과 링크</h3>
    <div class="row">
      <input id="resLink" readonly value="${esc(link)}"
        style="flex:1;min-width:240px;background:var(--bg3);color:var(--acc);border:1px solid var(--line);
               border-radius:7px;padding:6px 9px;font-size:12px">
      <button id="copyRes">복사</button>
    </div>
    <div class="note">이 링크를 열면 <b>같은 경기가 그대로</b> 재생됩니다 — 코드 두 개에서 시드가
      나오기 때문입니다. 상대에게 보내 결과 지문 <code>${esc(R.fp)}</code> 이 같은지 맞춰 보세요.
      값이 다르면 한쪽 데이터가 다릅니다.</div>`;
}

function drawHighlightList() {
  if (!R.clips || !R.clips.length) return "";
  return `<h3 style="margin-top:14px">다시 보기</h3>
    <div class="hlist">${R.clips.map((c, i) =>
      `<button data-c="${i}">${c.min}' <span class="k">${kindLabel(c)}</span></button>`).join("")}</div>`;
}

/* ── 경기 뒤 반응 ─────────────────────────────────────────────
   문구 표는 KM26 에서 그대로 가져왔습니다. 어느 쪽 팬 시선으로 볼지 고를 수 있습니다. */
let reactSide = "h";

function drawReactions() {
  if (!R.react || !R.react.h) return "";
  return `<h3 style="margin-top:16px">경기 뒤 반응</h3>
    <div class="row" style="margin-bottom:8px">
      <button class="rside on" data-s="h">${esc(R.home.short)} 팬</button>
      <button class="rside" data-s="a">${esc(R.away.short)} 팬</button>
    </div>
    <div id="reactBox">${reactHTML()}</div>`;
}

function reactHTML() {
  const r = R.react[reactSide];
  if (!r) return "";
  const tone = t => t > 0 ? "up" : t < 0 ? "dn" : "";
  const nOf = n => (n >= 1000 ? (n / 1000).toFixed(1) + "천" : String(n));
  const us = reactSide === "h" ? R.home.short : R.away.short;
  const them = reactSide === "h" ? R.away.short : R.home.short;

  const soc = x => `<div class="rmsg ${tone(x.tone)}${x.rival ? " riv" : ""}">
      <div class="who"><span class="av">${esc(x.emoji || "💬")}</span>
        <b class="nick">${esc(x.nick || "")}</b>
        ${x.rival ? `<span class="tag riv">${esc(them)} 팬</span>` : ""}</div>
      <div class="tx">${esc(x.txt)}</div></div>`;

  const brd = x => `<div class="rmsg ${tone(x.tone)}${x.rival ? " riv" : ""}${x.troll ? " troll" : ""}">
      <div class="who"><b class="nick">${esc(x.emoji || "")}${esc(x.nick || "")}</b>
        ${x.rival ? `<span class="tag riv">타팬</span>` : ""}
        ${x.troll ? `<span class="tag troll">상주</span>` : ""}
        ${x.label ? `<span class="tag">${esc(x.label)}</span>` : ""}
        <span class="vote">👍 ${nOf(x.up || 0)} · 👎 ${nOf(x.dn || 0)}
          <span class="sub">· 조회 ${nOf(x.views || 0)}</span></span></div>
      <div class="tx">${esc(x.txt)}</div></div>`;

  return `
    <div class="rgrid">
      <div>
        <div class="rh">📱 소셜미디어 <span class="sub">${esc(us)} 팬 타임라인 · 타팬 반응 포함</span></div>
        ${r.social.map(soc).join("") || `<div class="sub" style="padding:8px">조용합니다.</div>`}
      </div>
      <div>
        <div class="rh">💬 FM코리아 <span class="sub">추천·조회수는 글 반응입니다</span></div>
        ${r.fmk.map(brd).join("") || `<div class="sub" style="padding:8px">글이 없습니다.</div>`}
      </div>
    </div>`;
}

function bindReactions() {
  document.querySelectorAll(".rside").forEach(b => b.onclick = () => {
    reactSide = b.dataset.s;
    document.querySelectorAll(".rside").forEach(x => x.classList.toggle("on", x === b));
    $("#reactBox").innerHTML = reactHTML();
  });
}

boot();
</script>
</div></div>
</div>
</body>
</html>
