name: 🔀 상대와 결과가 다르게 나왔습니다
description: 같은 코드 두 개로 돌렸는데 결과 지문이 서로 다릅니다
title: "[결과 갈림] "
labels: ["결과 갈림", "우선"]
body:
  - type: markdown
    attributes:
      value: |
        ## 이 제보는 최우선으로 봅니다

        "코드 두 개만 있으면 누가 열어도 같은 경기"가 이 게임의 전제입니다. 그게 깨지면
        대전 자체가 성립하지 않습니다.

        ### 먼저 이 두 가지를 확인해 주세요 — 대부분 여기서 끝납니다

        1. **코드를 정확히 붙여넣었는지.** 앞뒤 공백이나 줄바꿈에 잘린 글자가 없어야 합니다.
        2. **양쪽 다 강력 새로고침(Ctrl+Shift+R / ⌘+Shift+R)을 한 뒤** 다시 돌려 보세요.
           브라우저가 옛 파일을 들고 있으면 다른 경기가 나옵니다.

        위 둘을 하고도 지문이 다르면 **브라우저 종류에 따라 갈리는 문제**일 수 있습니다.
        개발 중에 한 건 확인해 둔 상태이고(원인은 삼각함수 정밀도로 추정), 아래 정보가
        그걸 좁히는 데 직접 쓰입니다.

  - type: input
    id: fp1
    attributes:
      label: 내 쪽 결과 지문 (여덟 자리)
      placeholder: deaca9c0
    validations:
      required: true

  - type: input
    id: fp2
    attributes:
      label: 상대 쪽 결과 지문 (여덟 자리)
      placeholder: 3f1a77b2
    validations:
      required: true

  - type: input
    id: browser1
    attributes:
      label: 내 쪽 브라우저 · 기기
      description: 크롬/사파리/엣지/삼성인터넷 등 + PC인지 폰인지
      placeholder: 크롬 · 윈도우 PC
    validations:
      required: true

  - type: input
    id: browser2
    attributes:
      label: 상대 쪽 브라우저 · 기기
      description: 모르시면 비워 두셔도 됩니다. 다만 이 칸이 원인 추적에 가장 크게 쓰입니다.
      placeholder: 사파리 · 아이폰

  - type: textarea
    id: codes
    attributes:
      label: 대전 코드 두 개
      description: |
        **이게 가장 중요합니다.** 이 두 줄만 있으면 여기서 그대로 재현해 볼 수 있습니다.
        홈/원정 어느 쪽인지도 같이 적어 주세요.
      placeholder: |
        홈(내 쪽):   KM26D1-BhHsDhIjFNJKMvuvABpqsRClrAJGCs8SISgigpwFAAAAAAAAHoA
        원정(상대):  KM26D1-...
    validations:
      required: true

  - type: textarea
    id: diff
    attributes:
      label: 얼마나 다르던가요 (있으면)
      description: 점수만 다른지, 몇 분부터 갈리는지. 갈리기 시작한 시각을 아시면 특히 도움이 됩니다.
      placeholder: |
        전반은 똑같았는데 후반 20분쯤부터 해설이 달라졌습니다. 최종 점수는 2:1 / 1:1.

  - type: checkboxes
    id: tried
    attributes:
      label: 확인하셨나요
      options:
        - label: 양쪽 다 강력 새로고침을 하고 다시 돌려 봤습니다
        - label: 코드에 잘린 글자나 공백이 없는지 확인했습니다
