name: 🐞 버그 · 화면이 이상합니다
description: 버튼이 안 먹는다, 화면이 깨진다, 경기가 시작되지 않는다, 코드가 계속 거부된다
title: "[버그] "
labels: ["버그"]
body:
  - type: markdown
    attributes:
      value: |
        **경기가 아예 시작되지 않거나 화면이 비어 있다면** 먼저 강력 새로고침
        (Ctrl+Shift+R / ⌘+Shift+R)을 해 보세요. 브라우저가 옛 파일을 들고 있는 경우가 많습니다.
        그래도 그러면 꼭 알려 주세요 — 배포가 깨진 것일 수 있습니다.

  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      placeholder: |
        경기 화면에서 원정 칸에 코드를 붙여넣으면 "코드가 잘렸거나 손상되었습니다" 가 계속 뜹니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 어떻게 하면 다시 나오나요
      description: 눌렀던 순서대로 적어 주시면 됩니다.
      placeholder: |
        1. 경기 화면에서 홈 = 안양 선택
        2. 원정 = 울산 선택 후 "대전 코드 붙여넣기" 클릭
        3. 코드를 붙여넣음 → 바로 오류
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: 어느 화면인가요
      placeholder: 경기 화면 (match.html)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 브라우저 · 기기
      placeholder: 삼성인터넷 · 갤럭시 S24
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 대전 코드 · 결과 링크 · 화면 사진 (있으면)
      description: 코드가 거부되는 문제라면 **그 코드를 그대로 붙여 주세요.** 사진은 끌어다 놓으면 올라갑니다.
