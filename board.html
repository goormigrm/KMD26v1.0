<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMD26 · 전술 게시판</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#0b0f14;--line:#30363d;--txt:#e6edf3;--sub:#a9b4c0;
      --acc:#2ea8ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--gold:#e3b341}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 'Segoe UI','Malgun Gothic',sans-serif}
a{color:var(--acc);text-decoration:none}
h1{font-size:18px;color:var(--gold)}
h3{font-size:14px;color:var(--gold);margin-bottom:8px}
.sub{color:var(--sub);font-size:12.5px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:8px;
       padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
.note{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--acc);
      border-radius:6px;padding:9px 11px;font-size:12.5px;color:var(--sub);margin-top:9px}
code{background:var(--bg3);padding:1px 6px;border-radius:4px;color:var(--gold);font-size:12px}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:14px 16px;background:var(--ok);color:#04260e;border:none;border-radius:9px;
    font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;font-family:inherit;
    line-height:1.3;text-align:center;flex-wrap:wrap}
.go:hover{filter:brightness(1.08)}
.go .s{font-size:12.5px;font-weight:700;opacity:.75}

/* ── 찾기 줄 ───────────────────────────────────────────────────
   글자를 칠 때마다 **받아 둔 목록에서** 좁힙니다. 서버에 다시 묻지 않으므로
   한 글자("안")만 쳐도 곧바로 반응합니다 — board.js 의 matchQuery 주석 참고. */
.find{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.find input{flex:1;min-width:180px;background:var(--bg3);color:var(--txt);border:1px solid var(--line);
     border-radius:9px;padding:10px 13px;font-size:14.5px;font-family:inherit}
.find input:focus{outline:none;border-color:var(--acc)}
.find .cnt{flex:none;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
/* 자주 찾는 것 — 한 손으로 누르게 */
.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.quick button{padding:4px 10px;font-size:11.5px;border-radius:14px;font-weight:700;color:var(--sub)}
.quick button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ── 목록 ──────────────────────────────────────────────────────
   한 줄이 아니라 카드로 둡니다 — 폰에서 닉네임·구단·한 줄 소개·버튼 두 개가
   한 줄에 다 들어가지 않기 때문입니다. */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px;margin-top:12px}
.plan{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
      display:flex;flex-direction:column;gap:7px;min-width:0}
.plan:hover{border-color:#3d4650}
.plan .hd{display:flex;align-items:center;gap:7px;min-width:0}
.plan .bar{width:4px;height:20px;border-radius:2px;flex:none;background:var(--line)}
.plan .nk{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan .ag{margin-left:auto;flex:none;color:var(--sub);font-size:11px}
.plan .tags{display:flex;gap:5px;flex-wrap:wrap}
.plan .tg{background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:1px 7px;
      font-size:11px;font-weight:800;color:var(--gold)}
.plan .tg.f{color:var(--acc)}
.plan .tg.old{color:var(--warn);border-color:#5c4a1c}
.plan .nt{color:var(--sub);font-size:12.5px;line-height:1.45;min-height:18px;
      overflow-wrap:anywhere}
.plan .btns{display:flex;gap:6px;margin-top:auto}
.plan .btns a,.plan .btns button{flex:1;text-align:center;font-size:12.5px;padding:7px 8px}
.plan .btns a{background:var(--ok);color:#04260e;border:1px solid var(--ok);border-radius:8px;
      font-weight:800;text-decoration:none}
.plan .btns a:hover{filter:brightness(1.08)}
.empty{padding:26px 14px;text-align:center;color:var(--sub);font-size:13px;
      background:var(--bg2);border:1px dashed var(--line);border-radius:10px;margin-top:12px}

/* ── 왼쪽 바 (다른 화면과 같은 구조) ───────────────────────────── */
#app{display:flex;min-height:100vh}
#side{width:210px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
      padding:14px 10px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
#side h1{font-size:17px;color:var(--gold);margin-bottom:2px}
#side .brand{font-size:11px;color:var(--sub);margin-bottom:14px}
#navScroll{display:contents}
.navbtn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);
        padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px;margin-bottom:2px;
        text-decoration:none;font-weight:600}
.navbtn:hover{background:var(--bg3)}
.navbtn.on{background:var(--acc);color:#fff}
.navbtn .k{display:block;font-size:11px;font-weight:400;opacity:.8}
#mainWrap{flex:1;min-width:0}
#pageMain{padding:20px 22px 60px;max-width:1100px}
@media (max-width:820px){
  #app{display:block}
  #side{width:100%;height:auto;position:sticky;top:0;z-index:900;padding:8px 8px 0;
        border-right:none;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.5);
        display:grid;grid-template-columns:1fr;overflow:visible}
  #side h1{font-size:15px;margin:0}
  #side .brand{display:none}
  #navScroll{display:flex;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none}
  #navScroll::-webkit-scrollbar{display:none}
  .navbtn{display:inline-block;width:auto;white-space:nowrap;margin:0;padding:9px 12px;
          background:var(--bg3);border-radius:8px 8px 0 0}
  .navbtn .k{display:none}
  #pageMain{padding:14px 12px 60px}
}
/* 폰 — 경기 화면과 같은 비율로 함께 줄인다 */
@media (max-width:760px){
  body{font-size:13px}
  h1{font-size:16px} h3{font-size:13px} .sub{font-size:11.5px}
  #pageMain{padding:12px 10px 50px}
  .card{padding:10px 11px;margin-bottom:9px}
  button{padding:6px 9px;font-size:12px}
  .go{padding:12px;font-size:14.5px} .go .s{font-size:11px}
  .find input{font-size:13.5px;padding:9px 11px}
  .plans{grid-template-columns:1fr;gap:8px}
  .plan{padding:9px 10px}
  .plan .nk{font-size:13px}
  .plan .nt{font-size:11.5px}
  .note{font-size:11.5px;padding:7px 9px}
}
</style>
</head>
<body>
<div id="app">
<nav id="side">
  <h1>KMD26</h1>
  <div class="brand">개리그 매니저 듀얼</div>
  <div id="navScroll">
    <a class="navbtn" href="index.html">🏠 첫 페이지<span class="k">어떻게 하는 게임인가</span></a>
    <a class="navbtn" href="lineup.html">📋 라인업<span class="k">전술 · 선발 · 대전 코드</span></a>
    <a class="navbtn" href="match.html">⚽ 경기<span class="k">대전 · 연습 · 2D 재생</span></a>
    <a class="navbtn on" href="board.html">🗂 전술 게시판<span class="k">남이 올린 라인업과 붙기</span></a>
    <a class="navbtn" href="squad.html">👥 선수단<span class="k">29개 구단 1,024명</span></a>
  </div>
</nav>
<div id="mainWrap"><div id="pageMain">

<div class="top">
  <div><h1>전술 게시판</h1>
    <div class="sub" id="meta">불러오는 중…</div></div>
</div>

<div class="card">
  <div class="find">
    <input id="q" placeholder="닉네임 · 구단으로 찾기 — 한 글자만 넣어도 됩니다 (예: 안)"
           spellcheck="false" autocomplete="off">
    <button id="reload" title="목록을 다시 불러옵니다">↻ 새로고침</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="quick" id="quick"></div>
  <div class="note" id="hint">
    <b>상대가 접속해 있을 필요가 없습니다.</b> 남겨 둔 라인업과 붙습니다 —
    골라서 <b>이 라인업과 붙기</b>를 누르면 경기 화면이 그 코드를 든 채로 열립니다.
    내 라인업을 올리려면 <a href="lineup.html">라인업 화면</a>에서 <b>🔗 대전 코드 발급</b>을 누르세요.
  </div>
</div>

<div id="list"></div>

<script type="module">
import { boardOn, listPlans, ago, matchQuery } from "./src/board/board.js?v=6dce78598a";
import { decodePlan } from "./src/codec/duelcode.js?v=6dce78598a";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let DB = null, T = null;      // 선수 데이터 — 코드를 풀어 포메이션·구단 색을 보여 주는 데만 쓴다
let ROWS = null;              // 게시판에서 받아 둔 줄들 (찾기는 여기서 거른다)
let SHORT = {};               // 구단 약칭 → 구단 (색을 칠하려고)

/* 데이터를 못 읽어도 게시판은 뜨게 둡니다 — 목록·찾기·붙기는 데이터가 없어도 됩니다.
   데이터는 포메이션 뱃지와 구단 색을 더하는 **덤**입니다. */
async function loadData() {
  try {
    const m = await fetch("data/meta.json", { cache: "no-cache" }).then(r => r.json());
    const v = "?v=" + (m.dataHash || "");
    const [t, p] = await Promise.all([
      fetch("data/teams.json" + v).then(r => r.json()),
      fetch("data/players.json" + v).then(r => r.json()),
    ]);
    DB = { teams: t.teams, order: t.order, players: p, meta: m };
    T = t.tables;
    for (const id of Object.keys(DB.teams)) SHORT[DB.teams[id].short] = DB.teams[id];
  } catch (e) { DB = null; }
}

const codeCtx = () => ({ order: DB.order, tables: T, players: DB.players, dataHash: DB.meta.dataHash });

/** 코드 한 장에서 눈에 보여 줄 것만 꺼낸다 — 못 읽어도 줄은 그대로 보여 준다 */
function peek(code) {
  if (!DB) return null;
  try {
    const p = decodePlan(code, codeCtx());
    return { formation: p.formation, team: DB.teams[p.id], old: p.oldData || null };
  } catch (e) { return { bad: e.message }; }
}

async function load() {
  const box = $("#list");
  if (!boardOn()) {
    $("#meta").textContent = "";
    box.innerHTML = `<div class="empty"><b>게시판이 아직 켜지지 않았습니다.</b><br>
      <span class="sub">게임은 그대로 됩니다 — 대전 코드를 직접 주고받으면 됩니다.</span></div>`;
    $("#hint").style.display = "none";
    return;
  }
  box.innerHTML = `<div class="empty">불러오는 중…</div>`;
  try {
    ROWS = await listPlans(200);
  } catch (e) {
    ROWS = null;
    box.innerHTML = `<div class="empty" style="color:var(--bad)">
      게시판을 불러오지 못했습니다 — ${esc(e.message)}
      <br><span class="sub">잠시 뒤 <b>↻ 새로고침</b>을 눌러 보세요.</span></div>`;
    return;
  }
  $("#meta").textContent = `올라온 라인업 ${ROWS.length}개 · 새것부터`;
  drawQuick();
  draw();
}

/* 자주 찾는 구단 — 올라온 것 중 많은 순으로 여덟 개까지. 게시판이 한산할 때는
   무엇을 눌러야 할지 모르므로, **실제로 올라와 있는 구단**만 보여 준다. */
function drawQuick() {
  const n = {};
  for (const r of ROWS) { const t = String(r.team || "").trim(); if (t) n[t] = (n[t] || 0) + 1; }
  const top = Object.keys(n).sort((a, b) => n[b] - n[a]).slice(0, 8);
  $("#quick").innerHTML = !top.length ? "" :
    `<button data-q="" class="on">전체</button>` +
    top.map(t => `<button data-q="${esc(t)}">${esc(t)} ${n[t]}</button>`).join("");
  $("#quick").querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    $("#q").value = b.dataset.q;
    draw();
  });
}

function draw() {
  const box = $("#list");
  if (!ROWS) return;
  const q = $("#q").value;
  // 눌러 둔 자주 찾는 구단 표시를 지금 찾는 말에 맞춘다
  $("#quick").querySelectorAll("[data-q]").forEach(b =>
    b.classList.toggle("on", b.dataset.q === q.trim()));

  if (!ROWS.length) {
    $("#cnt").textContent = "";
    box.innerHTML = `<div class="empty"><b>아직 올라온 라인업이 없습니다.</b><br>
      <span class="sub">첫 번째가 되어 보세요 — <a href="lineup.html">라인업 화면</a>에서
      코드를 발급하면 그 자리에서 바로 올릴 수 있습니다.</span></div>`;
    return;
  }
  const hits = ROWS.filter(r => matchQuery(r, q));
  $("#cnt").textContent = q.trim() ? `${hits.length} / ${ROWS.length}개` : `${ROWS.length}개`;
  if (!hits.length) {
    // 조사("울산 로")가 어색해지므로 찾는 말을 앞에 따로 세운다
    box.innerHTML = `<div class="empty">찾는 말 <b>${esc(q)}</b> — 걸리는 라인업이 없습니다.
      <br><span class="sub">닉네임이나 구단 이름의 일부만 넣어도 됩니다 — 초성(<code>ㅇㅇ</code>)도 됩니다.</span></div>`;
    return;
  }
  box.innerHTML = `<div class="plans">${hits.map((r, i) => {
    const p = peek(r.code);
    const col = (p && p.team && p.team.col) || (SHORT[String(r.team || "").trim()] || {}).col;
    return `<div class="plan">
      <div class="hd">
        <span class="bar"${col ? ` style="background:${esc(col)}"` : ""}></span>
        <span class="nk">${esc(r.nick || "이름 없음")}</span>
        <span class="ag">${esc(ago(r.created_at))}</span>
      </div>
      <div class="tags">
        ${r.team ? `<span class="tg">${esc(r.team)}</span>` : ""}
        ${p && p.formation ? `<span class="tg f">${esc(p.formation)}</span>` : ""}
        ${p && p.old ? `<span class="tg old">옛 판 코드</span>` : ""}
        ${p && p.bad ? `<span class="tg old">읽을 수 없는 코드</span>` : ""}
      </div>
      <div class="nt">${esc(r.note || "")}</div>
      <div class="btns">
        <a href="match.html#c=${encodeURIComponent(r.code)}">⚽ 이 라인업과 붙기</a>
        <button data-c="${i}">코드 복사</button>
      </div>
    </div>`;
  }).join("")}</div>`;

  box.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    const code = hits[+b.dataset.c].code;
    navigator.clipboard?.writeText(code).then(
      () => { b.textContent = "복사됨 ✓"; setTimeout(() => { b.textContent = "코드 복사"; }, 1600); },
      () => { b.textContent = "복사 실패"; });
  });
}

$("#q").oninput = draw;
$("#reload").onclick = load;

/* 데이터를 먼저 읽고 목록을 부릅니다 — 포메이션 뱃지를 그리려면 데이터가 있어야 합니다.
   데이터가 없어도 loadData 는 조용히 넘어가므로 목록은 어차피 뜹니다. */
loadData().then(load);
</script>

</div></div>
</div>
</body>
</html>
