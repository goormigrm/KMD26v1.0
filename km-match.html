<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMD26 · KM26 경기</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#0b0f14;--line:#30363d;--txt:#e6edf3;--sub:#a9b4c0;
      --acc:#2ea8ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--gold:#e3b341;--km:#b98cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 'Segoe UI','Malgun Gothic',sans-serif}
a{color:var(--acc);text-decoration:none}
h1{font-size:18px;color:var(--km)}
h2{font-size:14.5px;color:var(--gold);margin-bottom:7px}
.sub{color:var(--sub);font-size:12.5px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:12px}
button{background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:8px;
       padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
.big{background:var(--km);color:#1b0c33;border-color:var(--km);font-size:15px;padding:12px 16px;width:100%}
.big:hover:not(:disabled){filter:brightness(1.08)}
.note{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--km);
      border-radius:6px;padding:9px 11px;font-size:12.5px;color:var(--sub);margin-top:9px}
.note b{color:var(--txt)}
code{background:var(--bg3);padding:1px 6px;border-radius:4px;color:var(--gold);font-size:12px}
.msg{margin-top:9px;font-size:13px;font-weight:700}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vs .side{min-width:0}
.vs .side.a{text-align:right}
.vs .tm{font-size:15px;font-weight:800}
.vs .nk{font-size:12px;color:var(--sub)}
.vs .mid{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;
     background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:4px 16px;white-space:nowrap}
.st{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.st td{padding:5px 8px;border-bottom:1px solid #21262d}
.st td.n{text-align:center;color:var(--sub);font-size:12px;width:40%}
.st td.h{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.st td.a{font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── 조건부 지시 요약 · 다시 보기 · 팬 반응 ────────────────────
   기본 경기 화면(match.html)과 **같은 모양**이어야 합니다. 두 갈래를 오가는 사람이
   같은 것을 다른 생김새로 두 번 배우지 않게 하려는 것입니다. */
.ordlog{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.ordlog>div{background:#0b0f14;border:1px solid var(--line);border-left:3px solid var(--gold);
     border-radius:6px;padding:5px 9px;font-size:12.5px;color:#e6ddc4}
.ordlog b{color:var(--gold);font-variant-numeric:tabular-nums}
.hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;margin-top:8px}
.hlist button{padding:6px 8px;font-size:12px;text-align:left;font-weight:700}
.hlist .k{display:block;font-size:11px;color:var(--sub);font-weight:600}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){ .rgrid{grid-template-columns:1fr} }
.rh{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:5px}
.rmsg{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--line);
      border-radius:7px;padding:6px 9px;font-size:12.5px;margin-bottom:5px;line-height:1.5}
.rmsg.up{border-left-color:var(--ok)}
.rmsg.dn{border-left-color:var(--bad)}
.rmsg .nick{color:var(--acc);font-size:11.5px;margin-right:4px}
.rmsg .who{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:2px}
.rmsg .av{font-size:13px}
.rmsg .tx{line-height:1.5}
.rmsg .tag{font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;border:1px solid var(--line);color:var(--sub)}
.rmsg .tag.riv{color:#d2a8ff;border-color:#553a7a}
.rmsg .tag.troll{color:var(--bad);border-color:#6d2b28}
.rmsg .vote{margin-left:auto;font-size:10.5px;color:var(--sub);white-space:nowrap}
.rmsg.riv{background:#10131c;border-color:#2b2440}
.rmsg.troll{background:#1b1113;border-color:#5a2b2b}
.rmsg.troll .nick{color:var(--bad)}
.rside{padding:5px 12px;font-size:12.5px}
.rside.on{border-color:var(--km);color:var(--km)}
.lnk{flex:1;min-width:240px;background:var(--bg3);color:var(--acc);border:1px solid var(--line);
     border-radius:7px;padding:6px 9px;font-size:12px;font-family:inherit}
h3{font-size:13.5px;color:var(--gold);margin:14px 0 0}
/* ── 2D 필드 ────────────────────────────────────────────────
   기본 경기 화면과 같은 캔버스입니다. 필드 위에는 아무 글자도 얹지 않습니다 —
   이름표가 공이 닿기도 전에 무슨 장면인지 알려 주면 김이 샙니다. */
.hl{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0f2415}
.hl canvas{width:100%;display:block;background:#0f2415}
.hl.idle canvas{filter:saturate(.62) brightness(.72)}
.hl.idle.open canvas{filter:none}
.hl .rep{position:absolute;left:9px;top:8px;background:#f8514966;border:1px solid #f85149;
     color:#fff;font-size:11px;font-weight:800;border-radius:5px;padding:1px 7px;display:none}
.hl.rep .rep{display:block}
.tick{background:var(--bg3);border:1px solid var(--line);border-top:none;
      border-radius:0 0 10px 10px;padding:7px 11px;font-size:12.5px;min-height:34px;color:var(--sub)}
.tick b{color:var(--txt)}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
       background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:6px 11px;margin-bottom:8px}
.board .t{font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .t.a{text-align:right}
.board .sc{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.board .cl{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
/* 90분 중 어디까지 왔나 — 2026 경기 화면과 같은 얇은 띠 */
.bar2{height:3px;background:#0b0f1466;border-radius:2px;overflow:hidden;margin-top:6px;grid-column:1/-1}
.bar2>i{display:block;height:100%;background:var(--km);width:0}

/* ── 득점자 패널 ──────────────────────────────────────────────
   필드 위에 얹는 **유일한** 덮개입니다. 공이 골망에 꽂힌 뒤에 뜨므로 미리 알려 주지
   않습니다. 커널은 오프사이드·VAR 로 취소된 골에도 goal 표시를 붙이므로,
   득점 기록에 없으면 NO GOAL 로 갈라 보여 줍니다. */
.gp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:5}
.gp.hidden{display:none}
.gpBox{background:rgba(8,12,17,.88);border:2px solid var(--gpCol,var(--km));
    border-left:10px solid var(--gpCol,var(--km));border-radius:12px;padding:14px 30px 13px;
    text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.65);
    animation:gpIn .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes gpIn{from{transform:scale(.72) translateY(10px);opacity:0}
                to{transform:scale(1) translateY(0);opacity:1}}
.gpTag{font-size:26px;font-weight:900;letter-spacing:4px;color:var(--gpCol,var(--km));
    text-shadow:0 0 18px var(--gpCol,var(--km));line-height:1}
.gpName{font-size:24px;font-weight:800;color:#fff;margin-top:6px;letter-spacing:.5px}
.gpMeta{font-size:13px;color:#dbe3ea;margin-top:4px}
.gpMeta b{color:var(--gold);font-size:15px}
.gpAst{color:#7ee787;margin-left:4px;font-weight:700}
.gpBox.off{border-color:var(--bad);border-left-color:var(--bad)}
.gpName.strike{text-decoration:line-through;color:#ffb4ad}
@media (max-width:760px){
  .gpBox{padding:11px 20px 10px}
  .gpTag{font-size:21px} .gpName{font-size:19px} .gpMeta{font-size:12px}
}

/* 대진 카드의 상대 고르기 */
.fin{flex:1;min-width:170px;background:var(--bg3);color:var(--txt);border:1px solid var(--line);
     border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit}
.fin:focus{outline:none;border-color:var(--km)}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
      background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 10px;
      cursor:pointer;font-size:13px;margin-bottom:5px}
.prow:hover{border-color:var(--km)}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.prow .nm .po{color:var(--sub);font-weight:400;font-size:11.5px;margin-left:5px}
.prow .tag{font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 6px;
      background:var(--bg2);border:1px solid var(--line);color:var(--sub)}
.prow .st{color:var(--km);font-size:11.5px;font-weight:800;white-space:nowrap}
.prow.on{border-color:var(--km);background:#1a1330}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ctrls button{font-size:12.5px;padding:6px 10px}
.ctrls button.on{border-color:var(--km);color:var(--km)}
/* 문자 중계 — 2026 경기 화면과 같은 모양·같은 차례.
   ⚠ 새 줄이 **맨 위**에 꽂히고 지난 줄이 아래로 밀린다(flushEvents 의 prepend).
     예전에는 아래로 쌓으면서 스크롤을 따라 내렸는데, 사람이 스크롤을 만지는 순간
     따라가기를 잃고 화면이 엉뚱한 데 머물렀다. 위에서 찍으면 그럴 일이 없다. */
#evts{max-height:420px;overflow-y:auto;background:var(--bg3);border:1px solid var(--line);
      border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.55}
#evts .ev{display:flex;gap:9px;padding:4px 8px;border-radius:6px}
#evts .ev .t{color:var(--sub);font-size:11.5px;min-width:32px;text-align:right;padding-top:2px;
             font-variant-numeric:tabular-nums;font-weight:700;flex:none}
#evts .ev .tm{font-size:11.5px;font-weight:800;flex:none;padding-top:2px}
#evts .ev .x{flex:1}
#evts .ev.goal{background:#12331c;color:var(--ok);font-weight:700}
#evts .ev.warn{color:#e8c46a}
#evts .ev.bad{color:#ffb4ad}
#evts .ev.info{color:var(--sub)}
/* 조건부 지시 — 미리 적어 둔 것이 실제로 걸린 순간이라 눈에 걸려야 한다 */
#evts .ev.order{background:#1a1608;border:1px solid #5c4a1c;border-left:3px solid var(--gold);
                color:var(--gold);font-weight:700}
#evts .ev.order .t{color:var(--gold)}

#app{display:flex;min-height:100vh}
#side{width:210px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
      padding:14px 10px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
#side h1{font-size:17px;color:var(--gold);margin-bottom:2px}
#side .brand{font-size:11px;color:var(--sub);margin-bottom:14px}
#navScroll{display:contents}
.navbtn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);
        padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px;margin-bottom:2px;
        text-decoration:none;font-weight:600}
.navbtn:hover{background:var(--bg3)}
.navbtn.on{background:var(--acc);color:#fff}
.navbtn.km.on{background:var(--km);color:#1b0c33}
.navbtn .k{display:block;font-size:11px;font-weight:400;opacity:.8}
#mainWrap{flex:1;min-width:0}
#pageMain{padding:20px 22px 60px;max-width:1100px}
@media (max-width:820px){
  #app{display:block}
  #side{width:100%;height:auto;position:sticky;top:0;z-index:900;padding:8px 8px 0;
        border-right:none;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.5);
        display:grid;grid-template-columns:1fr;overflow:visible}
  #side h1{font-size:15px;margin:0}
  #side .brand{display:none}
  #navScroll{display:flex;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none;
             -webkit-overflow-scrolling:touch;position:relative}
  #navScroll.drag{cursor:grab}
  #navScroll.grabbing{cursor:grabbing;user-select:none}
  #side.hasmore::after{content:'';position:absolute;right:0;top:0;bottom:0;width:26px;
       pointer-events:none;background:linear-gradient(90deg,#161b2200,#161b22)}
  #navScroll::-webkit-scrollbar{display:none}
  .navbtn{display:inline-block;width:auto;white-space:nowrap;margin:0;padding:9px 12px;
          background:var(--bg3);border-radius:8px 8px 0 0;font-size:13px}
  .navbtn .k{display:none}
  #pageMain{padding:14px 12px 60px}
}
@media (max-width:760px){
  body{font-size:13px} h1{font-size:16px} .sub{font-size:11.5px}
  #pageMain{padding:12px 10px 50px} .card{padding:10px 11px;margin-bottom:9px}
  .vs .mid{font-size:21px;padding:3px 11px} .vs .tm{font-size:13.5px}
}
</style>
</head>
<body>
<div id="app">
<nav id="side">
  <h1>KMD26</h1>
  <div class="brand">개리그 매니저 듀얼</div>
  <div id="navScroll"><a class="navbtn" href="index.html">🏠 첫 페이지<span class="k">어떻게 하는 게임인가</span></a>
    <a class="navbtn km" href="km-lineup.html">🎮 KM26 라인업<span class="k">스쿼드 가져오기 · 상대 고르기</span></a>
    <a class="navbtn km" href="km-board.html">🧩 KM26 전술 게시판<span class="k">가져온 명단으로 올라온 라인업</span></a>
    <a class="navbtn km on" href="km-match.html">🎯 KM26 경기<span class="k">가져온 명단으로 90분</span></a>
    <a class="navbtn km" href="km-record.html">📜 KM26 듀얼 기록실<span class="k">가져온 명단으로 붙은 경기</span></a>
</div>
</nav>
<div id="mainWrap"><div id="pageMain">

<div class="top">
  <div><h1>KM26 경기</h1>
    <div class="sub">개리그 매니저에서 가져온 명단끼리 붙습니다</div></div>
</div>

<!-- ⚠ 카드 차례는 **2026 경기 화면과 같습니다** —
     대진 → 2D·자막 → 문자 중계 → 경기 기록.
     경기 기록이 2D 위에 있으면 다 보기도 전에 점수가 눈에 들어옵니다. -->
<div class="card" id="setup">
  <h2>대진</h2>
  <div class="vs" id="vs"><div class="sub">준비 중…</div></div>
  <div class="note" id="how"></div>

  <!-- 상대 고르기 — 게시판 화면으로 옮겨 가지 않고 여기서 고릅니다.
       한 판 하고 나서 **다른 상대와 또 붙는** 길이 여기입니다(2026 의 "다시 대진 고르기"). -->
  <div style="margin-top:11px">
    <button id="oOpen">🧩 KM26 전술 게시판에서 상대 고르기</button>
    <div id="oBox" style="display:none">
      <div class="row" style="margin-top:9px">
        <input id="oq" class="fin" placeholder="닉네임 · 구단 · 한 줄 소개로 찾기 (예: 안)"
               spellcheck="false" autocomplete="off">
        <button id="oload">↻ 새로고침</button>
      </div>
      <div id="oppo" style="margin-top:8px"></div>
    </div>
  </div>

  <button class="big" id="play" style="margin-top:11px" disabled>⚔ 경기 시작</button>
  <div class="msg" id="playMsg"></div>
</div>

<div class="card" id="playCard" style="display:none">
  <div class="board">
    <div class="t" id="bH"></div>
    <div><div class="sc" id="bS">0 : 0</div><div class="cl" id="bC" style="text-align:center">0'</div></div>
    <div class="t a" id="bA"></div>
    <div class="bar2"><i id="prog"></i></div>
  </div>
  <div class="hl idle" id="hl">
    <span class="rep">● 리플레이</span>
    <canvas id="cv" width="700" height="440"></canvas>
    <!-- 필드 위에 얹는 것은 이것 하나뿐입니다 — 공이 골망에 꽂힌 **뒤에** 뜨므로
         무슨 장면인지 미리 알려 주지 않습니다(2026 경기 화면과 같은 판단). -->
    <div class="gp hidden" id="gp"></div>
  </div>
  <div class="tick" id="tick">경기를 시작합니다.</div>
  <div class="ctrls">
    <button id="pp">⏸ 일시정지</button>
    <button class="sp on" data-sp="1">1배</button>
    <button class="sp" data-sp="2">2배</button>
    <button class="sp" data-sp="4">4배</button>
    <button id="skip">⏩ 끝까지</button>
    <!-- 장면을 보는 중에만 나타납니다 — 관전 중에는 건너뛸 장면이 없습니다 -->
    <button id="clipSkip" style="display:none">⏩ 장면 건너뛰기</button>
    <span style="flex:1"></span>
    <button id="again">↻ 다시 대진 고르기</button>
  </div>
</div>

<div class="card" id="evtCard" style="display:none">
  <h2>문자 중계</h2>
  <div id="evts"></div>
</div>

<div class="card" id="resultCard" style="display:none">
  <h2>경기 기록</h2>
  <div class="vs" id="score"></div>
  <table class="st" id="stats"></table>
  <!-- 득점 · 주심 · 지문 · 조건부 지시 · 결과 링크 · 다시 보기 · 경기 뒤 반응 -->
  <div id="resultMore"></div>
  <div class="row" style="margin-top:12px">
    <button id="again2">↻ 다시 대진 고르기</button>
  </div>
</div>

</div></div>
</div>

<script type="module">
import { fatten, slimPack, squadSig, sigKey, checkPack } from "./src/km26/kmsave.js?v=88748df34e";
import { planSig } from "./src/engine/teams.js?v=88748df34e";
/* ⚠ deriveSeed 는 rng.js 에서 바로 가져온다 — duel.js 를 거치면 6천 줄짜리 커널이
     화면에 딸려 올라온다. 경기는 일꾼이 돌리므로 화면에는 커널이 필요 없다. */
import { deriveSeed } from "./src/engine/rng.js?v=88748df34e";
import { kmPostMatch, kmPostPlan, getKmPack, findPlanId, listKmPlans, kmBoardOn,
         myNick, rememberNick, NICK_MAX } from "./src/board/kmboard.js?v=88748df34e";

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const MINE_KEY = "kmd26.km26.mine";     // KM26 라인업 화면이 넣어 둔 내 팩
const SLOT_KEY = "kmd26.km26.slots";    // KM26 라인업 화면의 저장 슬롯
const AWAY_KEY = "kmd26.km26.away";     // KM26 게시판에서 고른 상대

let T = null, META = null, REACT = null;
let mine = null, away = null, mineRow = null;
let hNick = null, aNick = null;      // 화면·기록에 붙일 이름 (링크로 열면 올린 사람 이름)
let fromLink = false;                // 결과 링크로 열려 자동으로 도는 중인가

/** 저장해 둔 라인업이 여럿이면 어느 것으로 붙을지 묻는다 */
function drawSlotPick(slots, a) {
  $("#vs").innerHTML = `<div class="side"><div class="tm">\uc5b4\ub290 \ub77c\uc778\uc5c5\uc73c\ub85c \ubd99\uc744\uae4c\uc694</div></div>
    <div class="mid">VS</div>
    <div class="side a"><div class="tm">${a && a.pack ? esc(a.pack.team.short) : "\u2014"}</div>
      <div class="nk">${a ? esc(a.nick) : ""}</div></div>`;
  $("#how").innerHTML = slots.map((s, i) =>
    `<button data-sl="${i}" style="margin:3px 5px 0 0">${i + 1}. ${esc(s.team)} \u00b7 ${esc(s.formation)}</button>`).join("")
    + `<div style="margin-top:7px">KM26 \ub77c\uc778\uc5c5 \ud654\uba74\uc758 \uc800\uc7a5 \uc2ac\ub86f\uc5d0 \ub123\uc5b4 \ub454 \uac83\uc785\ub2c8\ub2e4.</div>`;
  $("#how").querySelectorAll("[data-sl]").forEach(b => b.onclick = () => {
    sessionStorage.setItem(MINE_KEY, JSON.stringify(slots[+b.dataset.sl]));
    location.reload();
  });
}

/* 지문은 `src/km26/kmsave.js` 의 것을 쓴다 — 라인업 화면과 **한 정의**여야 한다.
   `sigOf` 는 씨앗용(244자쯤) · `keyOf` 는 게시판이 "같은 글인가"를 가릴 때 쓰는 16자리다. */
const sigOf = p => planSig(Object.assign({}, p.plan, { id: p.team.id })) + "|" + squadSig(p);
const keyOf = p => sigKey(sigOf(p));

/* 어느 길로 들어왔든 **경기에 나올 스무 명**으로 맞춘다.
   ⚠ 저장 슬롯은 명단 전체(38명)를, 게시판은 줄인 팩(20명)을 담는다. 그대로 두면
     같은 라인업인데 길에 따라 씨앗이 갈려 **다른 경기**가 나온다. 결과 링크가
     성립하려면 여기서 한 모양으로 맞춰야 한다. */
const normPack = p => (p ? slimPack(fatten(p)) : null);

const readJSON = (store, key) => {
  try { return JSON.parse(store.getItem(key) || "null"); } catch (e) { return null; }
};

async function boot() {
  try {
    META = await fetch("data/meta.json", { cache: "no-cache" }).then(r => r.json());
    const teams = await fetch("data/teams.json?v=" + META.dataHash).then(r => r.json());
    T = teams.tables;
  } catch (e) {
    $("#how").textContent = "기본 데이터를 불러오지 못했습니다 — 새로고침해 보세요.";
    return;
  }

  /* 대진 카드의 버튼은 **어느 길로 들어왔든** 걸어 둔다 — 결과 링크로 열어 본 뒤에도
     "다른 상대와 붙어 볼까"가 되어야 한다. */
  bindSetup();

  /* ── 결과 링크로 열린 경우 ────────────────────────────────────
     `#m=<내 글 번호>,<상대 글 번호>` 다. 51자 코드가 없는 갈래라 링크에 담는 것은
     **게시판 글 두 개**다. 그 둘이면 명단·전술이 그대로 나오므로 같은 경기를
     누구든 다시 볼 수 있다(2026 갈래의 결과 링크와 같은 성질). */
  const L = /[#&]m=(\d+),(\d+)/.exec(location.hash || "");
  if (L) {
    fromLink = true;
    $("#how").innerHTML = "결과 링크를 여는 중… <span class='sub'>게시판에서 명단 두 벌을 받아 옵니다.</span>";
    try {
      const [rh, ra] = await Promise.all([getKmPack(+L[1]), getKmPack(+L[2])]);
      mine = normPack(rh.pack); away = normPack(ra.pack);
      mineRow = { planId: rh.id };
      hNick = rh.nick || "익명"; aNick = ra.nick || "익명";
      window.__awayRow = { id: ra.id, nick: aNick };
    } catch (e) {
      $("#how").innerHTML = `<span style="color:var(--bad)">결과 링크를 열지 못했습니다 — ${esc(e.message || e)}</span>
        <br><span class="sub">글이 지워졌거나 게시판에 닿지 못했습니다.</span>`;
      return;
    }
    drawVs();
    $("#how").innerHTML = `<b>결과 링크</b>로 열었습니다 — 올라온 명단 두 벌로 <b>같은 경기</b>를 다시 돌립니다.`;
    $("#play").disabled = false;
    $("#play").onclick = play;
    play();                      // 링크는 열자마자 시작한다 (2026 결과 링크와 같다)
    return;
  }

  let m = readJSON(sessionStorage, MINE_KEY);
  const a = readJSON(sessionStorage, AWAY_KEY);
  /* 게시판에서 바로 오면 세션에 내 라인업이 없다 — **저장 슬롯**에서 고르게 한다.
     KM26 라인업 화면에서 슬롯에 저장해 둔 것이 그대로 쓰인다. */
  if (!m) {
    const slots = (readJSON(localStorage, SLOT_KEY) || []).filter(Boolean);
    if (slots.length === 1) m = slots[0];
    else if (slots.length > 1) { drawSlotPick(slots, a); return; }
  }
  mineRow = m;
  mine = normPack(m && (m.pack || m));
  away = normPack(a && a.pack);
  hNick = myNick() || "나";
  aNick = (a && a.nick) || "상대";

  window.__awayRow = a;
  drawVs();
  drawHow();
  $("#play").onclick = play;
}

/** 지금 무엇이 모자란지 / 다 갖췄으면 얼마나 걸리는지 */
function drawHow() {
  const need = [];
  if (!mine) need.push(`<a href="km-lineup.html">KM26 라인업</a>에서 세이브를 불러와 라인업을 짜고 <b>저장 슬롯에 저장</b>해 주세요`);
  if (!away) need.push(`아래 <b>🧩 KM26 전술 게시판에서 상대 고르기</b>로 상대를 골라 주세요`);
  if (need.length) {
    $("#how").innerHTML = (need.length > 1 ? "먼저 두 가지가 있어야 합니다.<br>· " : "· ") + need.join("<br>· ");
    $("#play").disabled = true;
    if (mine && !away) openOppo();        // 상대만 없으면 고르는 칸을 바로 펴 준다
    return;
  }
  $("#how").innerHTML = `90분을 다 돌린 뒤 결과를 보여 주므로 <b>8초쯤</b> 걸립니다.`;
  $("#play").disabled = false;
}

/* ── 상대 고르기 ───────────────────────────────────────────────
   게시판 화면으로 옮겨 가지 않고 이 자리에서 고릅니다. **한 판 하고 나서 다른 상대와
   또 붙는 길**이기도 합니다 — 2026 경기 화면의 "다시 대진 고르기"와 같은 자리입니다.
   ⚠ 명단 팩이 15KB 라 주소에 담을 수 없어 세션 저장소를 거칩니다. */
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const choOf = t => { let o = ""; for (const ch of String(t || "")) { const c = ch.charCodeAt(0) - 0xac00;
  o += (c >= 0 && c <= 11171) ? CHO[Math.floor(c / 588)] : ch; } return o; };

let oppoRows = null;

function openOppo() {
  $("#oBox").style.display = "";
  $("#oOpen").textContent = "🧩 상대 고르기 접기";
  if (!oppoRows) loadOppo();
}
function toggleOppo() {
  if ($("#oBox").style.display === "none") { openOppo(); return; }
  $("#oBox").style.display = "none";
  $("#oOpen").textContent = "🧩 KM26 전술 게시판에서 상대 고르기";
}

async function loadOppo() {
  if (!kmBoardOn()) { $("#oppo").innerHTML = `<div class="sub">게시판이 아직 설정되지 않았습니다.</div>`; return; }
  $("#oppo").innerHTML = `<div class="sub">불러오는 중…</div>`;
  try {
    oppoRows = await listKmPlans(60);
    drawOppo();
  } catch (e) {
    $("#oppo").innerHTML = `<div class="sub">✗ ${esc(e.message || e)}</div>`;
  }
}

function drawOppo() {
  if (!oppoRows) return;
  const q = $("#oq").value.trim();
  const mineKey = mine ? keyOf(mine) : "";
  const nowId = (window.__awayRow || {}).id;
  const list = oppoRows.filter(r => {
    if (r.sig && r.sig === mineKey) return false;     // 내 글은 상대가 될 수 없다
    if (!q) return true;
    const hay = (r.nick || "") + " " + (r.team || "") + " " + (r.note || "");
    return hay.includes(q) || choOf(hay).includes(choOf(q));
  });
  if (!list.length) {
    $("#oppo").innerHTML = `<div class="sub">${oppoRows.length
      ? "찾는 라인업이 없습니다."
      : `아직 올라온 라인업이 없습니다. <a href="km-lineup.html">KM26 라인업</a>에서 올려 보세요.`}</div>`;
    return;
  }
  $("#oppo").innerHTML = list.map(r => `
    <div class="prow${r.id === nowId ? " on" : ""}" data-o="${r.id}">
      <span class="nm">${esc(r.nick)}<span class="po">${esc(r.team)}${r.season ? " · " + esc(r.season) : ""}</span></span>
      <span class="tag">${esc(r.note || "")}</span>
      <span class="st">${r.id === nowId ? "지금 상대" : "⚔ 붙기"}</span>
    </div>`).join("");
  $("#oppo").querySelectorAll("[data-o]").forEach(el => el.onclick = () => pickOppo(+el.dataset.o, el));
}

async function pickOppo(id, el) {
  const cell = el.querySelector(".st");
  const was = cell.textContent;
  cell.textContent = "가져오는 중…";
  try {
    const row = await getKmPack(id);
    sessionStorage.setItem(AWAY_KEY, JSON.stringify({ id: row.id, nick: row.nick, pack: row.pack }));
    away = normPack(row.pack);
    aNick = row.nick || "상대";
    window.__awayRow = { id: row.id, nick: aNick };
    /* 결과 링크로 열려 있었다면 그 해시를 지운다 — 안 지우면 새로고침 때
       방금 고른 상대가 아니라 링크의 옛 대진이 다시 뜬다. */
    if (location.hash) history.replaceState(null, "", location.pathname);
    fromLink = false;
    resetForNext();
    drawVs(); drawHow(); drawOppo();
    $("#setup").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    cell.textContent = was;
    msg("bad", "✗ " + (e.message || e));
  }
}

/* 다음 경기를 위해 지난 판의 흔적을 지운다 — 2026 의 "다시 대진 고르기"와 같은 자리다.
   ⚠ `mine` 과 `myPlanId` 는 그대로 둔다. 내 라인업은 바뀌지 않았다. */
function resetForNext() {
  stopClock();
  clipRun++;                     // 남아 있던 장면 재생을 끊는다 (아래 playClip 머리말 참고)
  R = null; inClip = false; clipSkip = false; lastRecNote = "";
  $("#pp").disabled = false; $("#skip").disabled = false;   // finish() 가 꺼 둔 것을 되살린다
  hideGoalPanel();
  $("#resultCard").style.display = "none";
  $("#playCard").style.display = "none";
  $("#evtCard").style.display = "none";
  $("#resultMore").innerHTML = "";
  $("#evts").innerHTML = "";
  $("#prog").style.width = "0%";
  $("#clipSkip").style.display = "none";
  $("#hl").classList.remove("rep");
  msg("", "");
}

/** 대진 카드의 버튼들 — 상대 고르기 · 찾기 · 다시 고르기 */
function bindSetup() {
  $("#oOpen").onclick = toggleOppo;
  $("#oload").onclick = loadOppo;
  $("#oq").oninput = drawOppo;
  $("#again").onclick = again;
  $("#again2").onclick = again;
}

/** "다시 대진 고르기" — 대진 카드로 올라가 상대 목록을 편다 */
function again() {
  resetForNext();
  drawHow();
  openOppo();
  loadOppo();                 // 그 사이 새 라인업이 올라왔을 수 있다
  $("#setup").scrollIntoView({ behavior: "smooth", block: "start" });
}

function drawVs() {
  $("#vs").innerHTML = `
    <div class="side">
      <div class="tm">${mine ? esc(mine.team.short) : "—"}</div>
      <div class="nk">${mine ? esc(hNick || "나") + " · 홈" : "내 라인업 없음"}</div>
    </div>
    <div class="mid">VS</div>
    <div class="side a">
      <div class="tm">${away ? esc(away.team.short) : "—"}</div>
      <div class="nk">${away ? esc(aNick || "상대") + " · 원정" : "상대 없음"}</div>
    </div>`;
}

async function play() {
  const badH = checkPack(mine, T), badA = checkPack(away, T);
  if (badH) return msg("bad", "✗ 내 라인업 — " + badH);
  if (badA) return msg("bad", "✗ 상대 라인업 — " + badA);

  const sigH = sigOf(mine), sigA = sigOf(away);
  if (sigH === sigA) return msg("bad", "✗ 양 팀의 선수·전술이 완전히 같습니다 — 한쪽을 바꿔 주세요.");

  $("#play").disabled = true;
  lastRecNote = "";              // 지난 판의 기록실 알림을 물려받지 않는다
  msg("", "90분을 돌리는 중… (8초쯤 걸립니다)");
  if (!REACT) {
    try { REACT = await fetch("data/reactions.json?v=" + META.dataHash).then(r => r.json()); }
    catch (e) { REACT = null; }
  }

  const w = new Worker("src/engine/matchworker.js?v=88748df34e", { type: "module" });
  w.onmessage = ev => {
    w.terminate();
    $("#play").disabled = false;
    if (!ev.data || !ev.data.ok) return msg("bad", "✗ " + ((ev.data && ev.data.error) || "경기를 돌리지 못했습니다."));
    show(ev.data);
  };
  w.onerror = err => {
    w.terminate(); $("#play").disabled = false;
    msg("bad", "✗ 일꾼이 멈췄습니다 — " + (err.message || ""));
  };

  /* ⚠ `xi` 는 **선수 id 배열**, `xiMap` 은 자리→선수 표다. 둘을 헷갈리면
     checkLineup 이 `(xiIds||[]).filter is not a function` 으로 넘어진다(실제로 겪음).
     자리 순서를 지켜야 하므로 포메이션 차례대로 뽑는다. */
  const plan = p => {
    const slots = ["GK", ...T.formation[p.plan.formation].map(s => s[1])];
    return Object.assign({}, p.plan, {
      id: p.team.id,
      xiMap: p.plan.xi,
      xi: slots.map(s => p.plan.xi[s]).filter(v => v != null),
    });
  };
  w.postMessage({
    km: true,                                   // 51자 코드 없이 도는 갈래
    seed: deriveSeed(sigH, sigA),
    teams: { [mine.team.id]: mine.team, [away.team.id]: away.team },
    players: { [mine.team.id]: mine.squad, [away.team.id]: away.squad },
    home: plan(mine), away: plan(away),
    reactions: REACT,
  });
}


/* ══ 2D 재생 ═══════════════════════════════════════════════════
   기본 경기 화면(match.html)의 캔버스 코드를 그대로 옮겼습니다. 일꾼이 이미
   `watch`(관전 트랙) · `clips`(결정적 장면) · `roster` 를 함께 보내 주므로
   여기서는 **그리기만** 하면 됩니다.

   ⚠ 화면이 시계를 앞지르면 안 됩니다 — 해설보다 먼저 골이 보이면 결과가 샙니다.
     관전 헤드는 언제나 `(지금 분 + 1) × 60초` 를 넘지 않습니다. */
const WATCH_STRIDE = 73;          // replay.js 의 WATCH_STRIDE 와 같아야 한다
const OPEN_MINUTES = 3;           // 초반 몇 분은 빨리 감지 않는다
const MIN_MS = 800;               // 1배속에서 한 분에 쓰는 시간
let R = null, minute = 0, watchSec = 0, speed = 1, playing = false, clipSkip = false;
let clipRun = 0;                 // 지금 돌고 있는 장면의 세대 (옛 장면을 끊는 데 쓴다)
let timer = null, rafId = null, drawnSec = -1, clipIdx = 0, evIdx = 0, inClip = false;

const isLight = hex => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
  if (!m) return false;
  const n = parseInt(m[1], 16);
  return (((n >> 16 & 255) * 299 + (n >> 8 & 255) * 587 + (n & 255) * 114) / 1000) > 150;
};

function drawPitch(g, W, H, PAD) {
  const X = x => PAD + x * (W - PAD * 2), Y = y => PAD + y * (H - PAD * 2);
  const pw = X(1) - X(0), ph = Y(1) - Y(0);
  g.fillStyle = "#12301b"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#14351e";
  for (let i = 0; i < 8; i += 2) g.fillRect(X(i / 8), 0, pw / 8, H);
  g.strokeStyle = "#ffffff44"; g.lineWidth = 1.6;
  g.strokeRect(X(0), Y(0), pw, ph);
  g.beginPath(); g.moveTo(X(.5), Y(0)); g.lineTo(X(.5), Y(1)); g.stroke();
  g.beginPath(); g.arc(X(.5), Y(.5), ph * 0.16, 0, 7); g.stroke();
  g.beginPath(); g.arc(X(.5), Y(.5), 2.6, 0, 7); g.fillStyle = "#ffffff88"; g.fill();
  for (const right of [false, true]) {
    const bw = pw * 0.16, gw = pw * 0.06, gd = 6;
    const bx = right ? X(1) - bw : X(0), gx = right ? X(1) - gw : X(0);
    g.strokeRect(bx, Y(.25), bw, ph * 0.5);
    g.strokeRect(gx, Y(.38), gw, ph * 0.24);
    g.strokeRect(right ? X(1) : X(0) - gd, Y(.43), gd, ph * 0.14);
    g.beginPath(); g.arc(right ? X(1) - pw * 0.105 : X(0) + pw * 0.105, Y(.5), 2, 0, 7); g.fill();
  }
}

function drawFrame(f) {
  const cv = $("#cv"), g = cv.getContext("2d");
  const W = cv.width, H = cv.height, PAD = 16;
  const X = x => PAD + x * (W - PAD * 2), Y = y => PAD + y * (H - PAD * 2);
  drawPitch(g, W, H, PAD);
  if (!f) return;
  for (let i = 0; i + 2 < f.a.length; i += 3) {
    const id = f.a[i], x = f.a[i + 1], y = f.a[i + 2];
    const p = R.roster[id] || {};
    const col = p.gk ? "#e3b341" : (p.side === "h" ? R.home.col : R.away.col);
    const r = p.gk ? 11.5 : 10.5;
    g.beginPath(); g.arc(X(x), Y(y), r, 0, 7);
    g.fillStyle = col; g.fill();
    g.lineWidth = 1.6; g.strokeStyle = "#0009"; g.stroke();
    if (id === f.o) {
      g.beginPath(); g.arc(X(x), Y(y), r + 4, 0, 7);
      g.strokeStyle = "#fff"; g.lineWidth = 2.2; g.stroke();
    }
    if (p.no !== "" && p.no != null) {
      g.fillStyle = isLight(col) ? "#0b0f14" : "#fff";
      g.font = "bold 11px system-ui,sans-serif"; g.textAlign = "center";
      g.fillText(String(p.no), X(x), Y(y) + 4);
    }
  }
  g.beginPath(); g.arc(X(f.r[0]), Y(f.r[1]), 5.5, 0, 7);
  g.fillStyle = "#1c1c1c"; g.fill(); g.strokeStyle = "#ffffff55"; g.lineWidth = 1; g.stroke();
  const bz = f.b[2] || 0, lift = Math.min(16, bz * 90);
  if (lift > 1) {
    g.beginPath(); g.ellipse(X(f.b[0]), Y(f.b[1]), 4.2, 2.2, 0, 0, 7);
    g.fillStyle = "#0006"; g.fill();
  }
  g.beginPath(); g.arc(X(f.b[0]), Y(f.b[1]) - lift, 5 + lift * 0.08, 0, 7);
  g.fillStyle = "#fff"; g.fill();
  g.strokeStyle = "#0008"; g.lineWidth = 1; g.stroke();
}

const watchCount = () => (R && R.watch ? (R.watch.length / WATCH_STRIDE) | 0 : 0);

function watchIndexAt(sec) {
  const W = R.watch, n = watchCount();
  if (!n) return -1;
  if (sec <= W[0]) return 0;
  if (sec >= W[(n - 1) * WATCH_STRIDE]) return n - 1;
  let lo = 0, hi = n - 1;
  while (lo + 1 < hi) {
    const mid = (lo + hi) >> 1;
    if (W[mid * WATCH_STRIDE] <= sec) lo = mid; else hi = mid;
  }
  const a = W[lo * WATCH_STRIDE], b = W[hi * WATCH_STRIDE];
  return b > a ? lo + (sec - a) / (b - a) : lo;
}

/* ⚠ 자리 번호가 아니라 **선수 id 로** 짝을 맞춘다. 교체·퇴장으로 명단이 밀리면
     두 선수가 서로에게 미끄러져 들어간다. */
function watchFrameObj(i, j, k) {
  const W = R.watch, A = i * WATCH_STRIDE, B = j * WATCH_STRIDE;
  const L = o => W[A + o] + (W[B + o] - W[A + o]) * k;
  const at = {};
  for (let q = 7; q < WATCH_STRIDE; q += 3) { const id = W[B + q]; if (id) at[id] = q; }
  const a = [];
  for (let q = 7; q < WATCH_STRIDE; q += 3) {
    const id = W[A + q];
    if (!id) continue;
    const o = at[id];
    a.push(id,
      o ? W[A + q + 1] + (W[B + o + 1] - W[A + q + 1]) * k : W[A + q + 1],
      o ? W[A + q + 2] + (W[B + o + 2] - W[A + q + 2]) * k : W[A + q + 2]);
  }
  return { c: W[A], b: [L(1), L(2), L(3)], o: W[A + 4] | 0, r: [L(5), L(6)], a };
}

function drawWatchAt(sec) {
  const fi = watchIndexAt(sec);
  if (fi < 0) return drawFrame((R && R.form0) || null);
  const i = Math.floor(fi), j = Math.min(watchCount() - 1, i + 1);
  drawFrame(watchFrameObj(i, j, fi - i));
}

/* ── 시계 ─────────────────────────────────────────────────────── */
function startClock() {
  stopClock();
  playing = true;
  $("#pp").textContent = "\u23f8 \uc77c\uc2dc\uc815\uc9c0";
  timer = setInterval(tickMinute, Math.max(60, MIN_MS / speed));
  loop();
}
function stopClock() {
  playing = false;
  $("#pp").textContent = "\u25b6 \uc7ac\uc0dd";
  if (timer) { clearInterval(timer); timer = null; }
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

function loop() {
  rafId = requestAnimationFrame(loop);
  if (inClip) return;
  /* 화면은 시계를 앞지르지 않는다 — 해설보다 먼저 골이 보이면 결과가 샌다 */
  const cap = (minute + 1) * 60;
  const step = (60 / Math.max(60, MIN_MS / speed)) * 16;
  watchSec = Math.min(cap, watchSec + step);
  if (Math.abs(watchSec - drawnSec) < 0.05) return;
  drawnSec = watchSec;
  drawWatchAt(watchSec);
}

function tickMinute() {
  if (inClip) return;
  minute++;
  $("#bC").textContent = minute + "'";
  $("#prog").style.width = Math.min(100, minute / 90 * 100) + "%";
  $("#hl").classList.toggle("open", minute < OPEN_MINUTES);
  flushEvents();
  const c = (R.clips || [])[clipIdx];
  if (c && Math.floor((c.min != null ? c.min : (c.f && c.f[0] ? c.f[0].c / 60 : 0))) <= minute) {
    clipIdx++;
    playClip(c);
    return;
  }
  if (minute >= 90) { stopClock(); finish(); }
}

/** 결정적 장면 한 편 — 프레임을 그대로 돌린다. 그동안 시계는 멈춘다.
    ⚠ 득점자 패널은 **공이 골망에 꽂히는 프레임(trig)** 에서 띄운다. 장면 처음에
      띄우면 무슨 일이 벌어질지 미리 알려 주는 꼴이 된다(2026 화면과 같은 판단). */
function playClip(c) {
  const fs = c.f || c.frames || [];
  if (!fs.length) return;
  /* 이 장면의 세대 번호. 다음 경기가 시작되거나 대진을 다시 고르면 번호가 올라가고,
     아직 남아 있던 옛 장면의 setTimeout 은 **조용히 끊긴다.**
     ⚠ 이게 없으면 판을 갈아엎은 뒤(`R = null`)에도 옛 장면이 한 번 더 깨어나
       `drawFrame` 에서 넘어지고(TypeError: reading 'roster'), `inClip` 이 true 로
       남아 **다음 경기의 시계가 영영 멈춘다.** 실제로 겪었다. */
  const my = ++clipRun;
  inClip = true; clipSkip = false;
  const hl = $("#hl");
  hl.classList.remove("idle");
  hl.classList.toggle("rep", !!c.replay);
  hideGoalPanel();
  $("#clipSkip").style.display = "";
  const trig = c.trig != null ? c.trig : Math.floor(fs.length * 0.6);
  const done = () => {
    inClip = false; clipSkip = false;
    hl.classList.add("idle"); hl.classList.remove("rep");
    hl.classList.toggle("open", minute < OPEN_MINUTES);
    $("#clipSkip").style.display = "none";
    hideGoalPanel();
    watchSec = Math.max(watchSec, fs[fs.length - 1].c || watchSec);
  };
  let i = 0;
  const step = () => {
    if (my !== clipRun || !R) return;          // 지난 판의 장면 — 여기서 조용히 끝낸다
    if (clipSkip) { drawFrame(fs[fs.length - 1]); done(); return; }
    if (i >= fs.length) { done(); return; }
    const f = fs[i++];
    drawFrame(f);
    if (i === trig + 1 && c.kind === "goal") showGoalPanel(c);
    setTimeout(step, Math.max(16, 42 / speed));
  };
  step();
}

/* ── 득점자 패널 ──────────────────────────────────────────────
   ⚠ 커널은 오프사이드·VAR 로 취소된 골에도 `goal` 을 붙인다. 득점 기록(goalLine)에
     없으면 취소된 것이므로 **NO GOAL** 로 갈라 보여 준다 — 있지도 않은 득점을
     알리지 않기 위해서다. */
function showGoalPanel(c) {
  const g = goalOf(c);
  const team = c.side === "h" ? R.home : R.away;
  const el = $("#gp");
  el.style.setProperty("--gpCol", g ? (team.col || "#b98cff") : "#f85149");
  el.innerHTML = g
    ? `<div class="gpBox">
         <div class="gpTag">GOAL!</div>
         <div class="gpName">${esc(g.n || "득점")}</div>
         <div class="gpMeta"><b>${c.min}'</b> · ${esc(team.short)}${
           g.a ? `<span class="gpAst">도움 ${esc(g.a)}</span>` : ""}</div>
       </div>`
    : `<div class="gpBox off">
         <div class="gpTag">NO GOAL</div>
         <div class="gpName strike">${esc(team.short)}</div>
         <div class="gpMeta"><b>${c.min}'</b> · 🚩 <b style="color:#ff7b72">득점 취소</b></div>
       </div>`;
  el.classList.remove("hidden");
}
function hideGoalPanel() {
  const el = $("#gp");
  if (el) { el.classList.add("hidden"); el.innerHTML = ""; }
}

/** 그 분까지의 문자중계를 흘린다.
    ⚠ 2026 경기 화면(match.html push)과 같은 차례다 — **새 줄이 맨 위**에 꽂히고
      지난 줄이 아래로 밀린다. 여러 줄이 한 번에 풀릴 때도 시각 순서대로 prepend 하므로
      마지막(가장 새) 줄이 결국 맨 위에 온다. */
function flushEvents() {
  const box = $("#evts");
  let added = false;
  while (evIdx < (R.events || []).length) {
    const e = R.events[evIdx];
    if (!e.noTime && e.min > minute) break;
    evIdx++;
    added = true;
    const d = document.createElement("div");
    d.className = "ev " + (e.type || "txt");
    d.innerHTML = `<span class="t">${e.noTime ? "" : e.min + "'"}</span>` +
      (e.t ? `<span class="tm" style="color:${esc(e.col || "#a9b4c0")}">${esc(e.t)}</span>` : "") +
      `<span class="x">${esc(e.txt || "")}</span>`;
    box.prepend(d);
    $("#tick").innerHTML = `<b>${e.noTime ? "" : e.min + "' "}</b>${esc(e.txt || "")}`;
    if (e.hg != null) $("#bS").textContent = `${e.hg} : ${e.ag}`;
  }
  // 맨 위가 가장 새 줄이므로 위로 붙여 둔다 (아래로 따라 내려갈 일이 없다)
  if (added) box.scrollTop = 0;
}

function finish() {
  minute = 90;
  $("#bC").textContent = "\uacbd\uae30 \uc885\ub8cc";
  $("#prog").style.width = "100%";
  $("#clipSkip").style.display = "none";
  hideGoalPanel();
  flushEvents();
  $("#bS").textContent = `${R.home.goals} : ${R.away.goals}`;
  /* \ub05d\ub09c \uacbd\uae30\uc5d0\uc11c \ub204\ub97c \uac83\uc774 \uc5c6\ub294 \ubc84\ud2bc\uc740 \uaebc \ub454\ub2e4 \u2014 \ub20c\ub7ec\ub3c4 \uc548 \uba39\ub294 \uac83\ucc98\ub7fc \ubcf4\uc774\uc9c0 \uc54a\uac8c.
     \u26a0 "\ub2e4\uc2dc \ubcf4\uae30"\ub294 \uadf8\ub300\ub85c \ub418\uc5b4\uc57c \ud558\ubbc0\ub85c \ubc30\uc18d \ubc84\ud2bc\uc740 \uc0b4\ub824 \ub454\ub2e4. */
  $("#pp").disabled = true; $("#skip").disabled = true;
  $("#tick").innerHTML = `<b>\ud83c\udfc1 \uacbd\uae30 \uc885\ub8cc</b> \u2014 \uc544\ub798\uc5d0 \uacbd\uae30 \uae30\ub85d\uacfc \ud32c \ubc18\uc751\uc774 \uc788\uc2b5\ub2c8\ub2e4.`;
  $("#resultCard").style.display = "";
  $("#resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
}

/** 결과가 도착하면 재생을 준비한다 */
function startReplay(r) {
  clipRun++;                     // 지난 판의 장면이 남아 있으면 여기서 끊는다
  R = r;
  minute = 0; watchSec = 0; drawnSec = -1; clipIdx = 0; evIdx = 0; inClip = false; clipSkip = false;
  $("#playCard").style.display = "";
  $("#evtCard").style.display = "";
  $("#evts").innerHTML = "";
  $("#bH").textContent = r.home.short;
  $("#bA").textContent = r.away.short;
  $("#bS").textContent = "0 : 0";
  $("#bC").textContent = "0'";
  $("#prog").style.width = "0%";
  $("#clipSkip").style.display = "none";
  /* 지난 판이 끝나며 꺼 둔 버튼을 되살린다 — 같은 화면에서 두 번째 경기를 돌릴 수 있다 */
  $("#pp").disabled = false; $("#skip").disabled = false;
  hideGoalPanel();
  $("#hl").classList.add("idle", "open");
  drawFrame(r.form0 || null);
  $("#pp").onclick = () => (playing ? stopClock() : startClock());
  $("#clipSkip").onclick = () => { clipSkip = true; };
  $("#skip").onclick = () => {
    clipSkip = true; stopClock();
    while (minute < 90) { minute++; flushEvents(); }
    finish();
  };
  document.querySelectorAll(".sp").forEach(b => b.onclick = () => {
    speed = +b.dataset.sp;
    document.querySelectorAll(".sp").forEach(x => x.classList.toggle("on", x === b));
    if (playing) startClock();
  });
  $("#playCard").scrollIntoView({ behavior: "smooth", block: "start" });
  startClock();
}

function msg(cls, text) { $("#playMsg").className = "msg " + cls; $("#playMsg").textContent = text; }

const pct = (ok, n) => (n ? Math.round(ok / n * 100) + "%" : "-");

function show(r) {
  msg("ok", "✓ 90분을 다 돌렸습니다 — 재생을 시작합니다.");
  R = r;
  /* ⚠ 결과 카드는 경기가 끝난 뒤에 연다(finish). 미리 열면 점수가 새어 나간다. */
  $("#resultCard").style.display = "none";
  $("#score").innerHTML = `
    <div class="side"><div class="tm">${esc(r.home.short)}</div>
      <div class="nk">${esc(hNick || "나")}</div></div>
    <div class="mid">${r.home.goals} : ${r.away.goals}</div>
    <div class="side a"><div class="tm">${esc(r.away.short)}</div>
      <div class="nk">${esc(aNick || "상대")}</div></div>`;

  /* 표는 **기본 경기 화면과 같은 열한 줄**이다.
     ⚠ 예전에는 `poss`·`sot`·`yel` 로 읽고 있었다. 엔진이 내는 이름이 아니라
       열한 줄 중 여러 칸이 조용히 0 으로 찍혔다. */
  const s = r.stats || {}, h = s.h || {}, a = s.a || {};
  const P = r.possession || { h: 0, a: 0 };
  const line = (k, hv, av) => `<tr><td class="h">${hv ?? 0}</td><td class="n">${esc(k)}</td><td class="a">${av ?? 0}</td></tr>`;
  $("#stats").innerHTML = [
    line("점유율", P.h + "%", P.a + "%"),
    line("슈팅", h.shot, a.shot),
    line("유효 슈팅", h.shotOn, a.shotOn),
    line("패스", h.pass, a.pass),
    line("패스 성공률", pct(h.passOk, h.pass), pct(a.passOk, a.pass)),
    line("태클", h.tackle, a.tackle),
    line("파울", h.foul, a.foul),
    line("경고 · 퇴장", `${h.yellow ?? 0} · ${h.red ?? 0}`, `${a.yellow ?? 0} · ${a.red ?? 0}`),
    line("코너", h.corner, a.corner),
    line("오프사이드", h.offside, a.offside),
    line("크로스", h.cross, a.cross),
  ].join("");

  paintResult();

  startReplay(r);        // 2D 재생 — 문자중계는 시각에 맞춰 흐른다
  record(r);
}

/* 결과 카드의 아랫부분을 한 번에 그린다.
   ⚠ **여러 번 불린다.** 처음 그릴 때는 내 글 번호를 아직 모를 수 있고(그러면 결과 링크가
     "아직 만들 수 없습니다"로 나온다), `record()` 가 지문으로 번호를 찾아내면 그때
     링크를 만들 수 있으므로 다시 그려야 한다. 안 그러면 기록실에는 남았는데
     링크 칸만 "아직 만들 수 없습니다"로 남는다(사용자 제보).
   ⚠ 기록실 알림은 `lastRecNote` 에 들고 있어 다시 그려도 지워지지 않는다. */
function paintResult() {
  $("#resultMore").innerHTML =
    drawGoalLine() + drawMeta() + drawOrderLog() + drawResultLink() + drawHighlightList() + drawReactions();
  bindResult();
}

/* ── 결과 카드의 아랫부분 ──────────────────────────────────────
   기본 경기 화면(match.html)의 차례를 그대로 따른다 —
   득점 → 주심·지문 → 조건부 지시 → 결과 링크 → 다시 보기 → 경기 뒤 반응. */

function drawGoalLine() {
  if (!R.goalLine || !R.goalLine.length) return "";
  return `<div class="note"><b>득점</b> — ${R.goalLine.map(g =>
    `${g.min}' ${esc(g.n || "")} <span class="sub">(${esc(g.side === "h" ? R.home.short : R.away.short)})</span>`
  ).join(" · ")}</div>`;
}

function drawMeta() {
  return `<div class="note">
    주심 ${esc(R.referee || "-")} · 계산 ${R.elapsedMs}ms
    <br>씨앗 <code>${R.seed.toString(16)}</code> · 결과 지문 <code>${esc(R.fp)}</code>
    <br><span class="sub">같은 명단·같은 라인업끼리 붙으면 언제 어디서 돌려도 이 지문이 나옵니다.</span></div>`;
}

/* 조건부 지시 요약 — "발동한 건지 아닌 건지 알 수가 없다"에 대한 답이다.
   ⚠ 발동했더라도 **이미 그 상태였으면** 줄이 남지 않는다(orders.js 의 `changed`). */
function drawOrderLog() {
  const rows = (R.events || []).filter(e => e.type === "order");
  if (!rows.length) {
    return `<div class="note"><b>📋 조건부 지시</b> — 이 경기에서는 발동한 지시가 없습니다.
      <br><span class="sub">KM26 라인업 화면에서 <b>"60분에 지고 있으면 → 총공세"</b> 처럼 미리 적어 두면
      조건이 맞는 순간 자동으로 실행되고, 그 시각이 여기 남습니다.
      경기 중에는 아무도 버튼을 못 누르므로 여기가 승부처입니다.
      <br>조건이 맞았더라도 전술이 <b>이미 그 상태였다면</b> 바꿀 것이 없어 줄이 남지 않습니다.</span></div>`;
  }
  return `<div class="note"><b>📋 조건부 지시</b> — ${rows.length}건 발동
    <div class="ordlog">${rows.map(e => `<div><b>${esc(String(e.min ?? ""))}'</b>
      ${e.t ? `<span style="color:${esc(e.col || "#a9b4c0")}">${esc(e.t)}</span>` : ""}
      ${esc((e.txt || "").replace(/^📋\s*/, ""))}</div>`).join("")}</div></div>`;
}

/* ── 결과 링크 ────────────────────────────────────────────────
   KM26 갈래에는 51자 코드가 없다. 대신 **게시판 글 두 개**를 가리킨다 —
   그 둘이면 명단·전술이 그대로 나오므로 같은 경기를 누구든 다시 볼 수 있다.
   ⚠ 그래서 **양쪽 다 게시판에 올라와 있어야** 링크가 나온다. */
let myPlanId = null;             // record() 가 찾아 두면 링크도 이 값을 쓴다

function drawResultLink() {
  const head = `<h3>🔗 결과 링크</h3>`;
  const a = window.__awayRow;
  const myId = myPlanId || (mineRow && mineRow.planId);
  const rec = `<h3>🏛 KM26 듀얼 기록실</h3><div class="note" id="recBox">${lastRecNote}</div>`;
  if (!myId || !a || !a.id) {
    return head + `<div class="note"><b>아직 링크를 만들 수 없습니다.</b>
      링크에 담기는 것은 게시판에 올라온 <b>글 두 개</b>라서, 양쪽 다 올라와 있어야 합니다.
      <br><span class="sub">바로 아래 칸에서 내 라인업을 올리면 링크도 함께 나옵니다.</span></div>` + rec;
  }
  const link = `${location.origin}${location.pathname}#m=${myId},${a.id}`;
  return head + `
    <div class="row" style="margin-top:8px">
      <input id="resLink" readonly value="${esc(link)}" class="lnk">
      <button id="copyRes">복사</button>
    </div>
    <div class="note">이 링크를 열면 <b>같은 경기가 그대로</b> 재생됩니다 — 올라온 명단 두 벌에서
      씨앗이 나오기 때문입니다. 상대에게 보내 결과 지문 <code>${esc(R.fp)}</code> 이 같은지 맞춰 보세요.</div>`
    + rec;
}

function drawHighlightList() {
  if (!R.clips || !R.clips.length) return "";
  return `<h3>다시 보기</h3>
    <div class="hlist">${R.clips.map((c, i) =>
      `<button data-c="${i}">${c.min}' <span class="k">${esc(kindLabel(c))}</span></button>`).join("")}</div>`;
}

const KIND_N = { goal: "골", miss: "결정적 기회", save: "선방", pen: "페널티킥", red: "퇴장" };
/* ⚠ 커널은 오프사이드·VAR 로 취소된 골에도 goal 을 붙인다 — 득점 기록에 없으면 취소된 것이다 */
const goalOf = c => (R.goalLine || []).find(g => g.side === c.side && Math.abs((g.min || 0) - c.min) <= 1) || null;
const kindLabel = c => (c.kind === "goal" && !goalOf(c)) ? "득점 취소" : (KIND_N[c.kind] || c.kind);

/* ── 경기 뒤 반응 ─────────────────────────────────────────────
   문구 표는 KM26 원본에서 그대로 가져온 것이다. 어느 쪽 팬 시선으로 볼지 고를 수 있다. */
let reactSide = "h";

function drawReactions() {
  if (!R.react || !R.react.h) return "";
  return `<h3>경기 뒤 반응</h3>
    <div class="row" style="margin:8px 0">
      <button class="rside on" data-s="h">${esc(R.home.short)} 팬</button>
      <button class="rside" data-s="a">${esc(R.away.short)} 팬</button>
    </div>
    <div id="reactBox">${reactHTML()}</div>`;
}

function reactHTML() {
  const r = R.react[reactSide];
  if (!r) return "";
  const tone = t => t > 0 ? "up" : t < 0 ? "dn" : "";
  const nOf = n => (n >= 1000 ? (n / 1000).toFixed(1) + "천" : String(n));
  const us = reactSide === "h" ? R.home.short : R.away.short;
  const them = reactSide === "h" ? R.away.short : R.home.short;

  const soc = x => `<div class="rmsg ${tone(x.tone)}${x.rival ? " riv" : ""}">
      <div class="who"><span class="av">${esc(x.emoji || "💬")}</span>
        <b class="nick">${esc(x.nick || "")}</b>
        ${x.rival ? `<span class="tag riv">${esc(them)} 팬</span>` : ""}</div>
      <div class="tx">${esc(x.txt)}</div></div>`;

  const brd = x => `<div class="rmsg ${tone(x.tone)}${x.rival ? " riv" : ""}${x.troll ? " troll" : ""}">
      <div class="who"><b class="nick">${esc(x.emoji || "")}${esc(x.nick || "")}</b>
        ${x.rival ? `<span class="tag riv">타팬</span>` : ""}
        ${x.troll ? `<span class="tag troll">상주</span>` : ""}
        ${x.label ? `<span class="tag">${esc(x.label)}</span>` : ""}
        <span class="vote">👍 ${nOf(x.up || 0)} · 👎 ${nOf(x.dn || 0)}
          <span class="sub">· 조회 ${nOf(x.views || 0)}</span></span></div>
      <div class="tx">${esc(x.txt)}</div></div>`;

  return `<div class="rgrid">
      <div>
        <div class="rh">📱 소셜미디어 <span class="sub">${esc(us)} 팬 타임라인 · 타팬 반응 포함</span></div>
        ${r.social.map(soc).join("") || `<div class="sub" style="padding:8px">조용합니다.</div>`}
      </div>
      <div>
        <div class="rh">💬 FM코리아 <span class="sub">추천·조회수는 글 반응입니다</span></div>
        ${r.fmk.map(brd).join("") || `<div class="sub" style="padding:8px">글이 없습니다.</div>`}
      </div>
    </div>`;
}

/** 결과 카드 안의 버튼들 — 다시 보기 · 링크 복사 · 팬 시선 바꾸기 */
function bindResult() {
  $("#resultMore").querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    stopClock();                       // 끝난 뒤에도 시계를 다시 걸지 않는다
    playClip(R.clips[+b.dataset.c]);
    $("#playCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  const cr = $("#copyRes");
  if (cr) cr.onclick = () => {
    const t = $("#resLink"); t.select();
    navigator.clipboard?.writeText(t.value).then(
      () => { cr.textContent = "복사됨 ✓"; setTimeout(() => { cr.textContent = "복사"; }, 1600); },
      () => { cr.textContent = "Ctrl+C"; });
  };
  $("#resultMore").querySelectorAll(".rside").forEach(b => b.onclick = () => {
    reactSide = b.dataset.s;
    $("#resultMore").querySelectorAll(".rside").forEach(x => x.classList.toggle("on", x === b));
    $("#reactBox").innerHTML = reactHTML();
  });
}

/* ── KM26 듀얼 기록실에 남긴다 ─────────────────────────────────
   글 두 개를 가리키는 방식이라 **양쪽 다 게시판에 올라와 있어야** 한다.

   ⚠ 예전에는 `mineRow.planId` 가 없으면 그 자리에서 포기했다. 그런데 그 값은
     **라인업 화면에서 그 순간 올린 경우에만** 들어 있다. 저장 슬롯에서 왔거나,
     지난번에 이미 올려 둔 경우에는 비어 있어서 — 게시판에 멀쩡히 올라와 있는데도
     "먼저 게시판에 올려야 합니다"가 떴다. 그래서 **지문으로 먼저 찾아본다.**
   ⚠ 그래도 없으면 아직 안 올린 것이 맞다. 막다른 안내 대신 **여기서 올릴 버튼**을 준다.
     올리는 것은 남에게 보이는 일이라 스스로 누를 때만 한다. */
async function record(r) {
  const a = window.__awayRow;
  if (!kmBoardOn()) { recNote("게시판이 아직 설정되지 않아 기록실에 남기지 않습니다."); return; }
  if (!a || !a.id) { recNote("게시판에서 고른 상대와 붙은 경기만 기록실에 남습니다."); return; }

  let myId = (mineRow && mineRow.planId) || null;
  if (!myId && mine) myId = await findPlanId(keyOf(mine));   // 이미 올려 둔 글이 있으면 그것
  if (!myId) {
    recNote(`<b>내 라인업이 아직 게시판에 없습니다.</b> 기록실은 <b>글 두 개</b>를 가리키는 방식이라,
      내 라인업도 올라와 있어야 이 경기가 남습니다.
      <div class="row" style="margin-top:8px"><button id="postNow">🧩 지금 올리고 기록실에 남기기</button></div>`);
    const b = $("#postNow");
    if (b) b.onclick = () => postThenRecord(r, b);
    return;
  }
  myPlanId = myId;
  paintResult();               // 이제 결과 링크를 만들 수 있다 — 그 칸을 다시 그린다
  await sendMatch(r, myId, a);
}

/** 내 라인업을 올린 뒤 이어서 경기를 남긴다 — 사용자가 버튼을 눌렀을 때만 */
async function postThenRecord(r, btn) {
  const nick = (prompt("게시판에 쓸 닉네임 (최대 " + NICK_MAX + "자)", myNick() || "") || "").trim();
  if (!nick) return;
  btn.disabled = true;
  recNote("올리는 중…");
  const res = await kmPostPlan({
    nick, team: mine.team.short, season: mine.season,
    sig: keyOf(mine), pack: mine,          // 이미 스무 명으로 맞춘 팩이다
  });
  if (!res.ok || !res.id) {
    recNote(`<span style="color:var(--bad)">올리지 못했습니다 — ${esc(res.why || "글 번호를 받지 못했습니다")}</span>`);
    return;
  }
  rememberNick(nick);
  hNick = nick;
  myPlanId = res.id;
  paintResult();               // 링크를 이제 만들 수 있다
  await sendMatch(r, res.id, window.__awayRow);
}

async function sendMatch(r, myId, a) {
  recNote("기록실에 남기는 중…");
  const res = await kmPostMatch({
    fp: r.fp, hPlan: myId, aPlan: a.id,
    hNick: hNick, hTeam: mine.team.short,
    aNick: aNick, aTeam: away.team.short,
    hg: r.home.goals, ag: r.away.goals,
  });
  recNote(res.ok
    ? (res.dup
        ? `이미 올라와 있는 경기입니다. <a href="km-record.html">기록실에서 보기</a>`
        : `이 경기를 남겼습니다 ✓ <a href="km-record.html">기록실에서 보기</a>`)
    : `<span style="color:var(--warn)">남기지 못했습니다 — ${esc(res.why)}</span>
       <br><span class="sub">경기 결과와 다시 보기는 그대로입니다.</span>`);
}

/** 기록실 칸은 `drawResultLink` 가 늘 그려 둔다 — 여기서는 그 안만 바꾼다 */
let lastRecNote = "";
function recNote(html) {
  lastRecNote = html;
  const box = $("#recBox");
  if (box) box.innerHTML = html;
}

boot();
</script>
